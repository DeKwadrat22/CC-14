# Event Tables

- type: entityTable
  id: MeteorSwarmDustEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: SpaceDustMinor
    - id: SpaceDustMajor

- type: entityTable
  id: MeteorSwarmSmallChanceEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: MeteorSwarmSmall
      prob: 0.15

- type: entityTable
  id: MeteorSwarmMildTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - !type:NestedSelector
        tableId: MeteorSwarmDustEventsTable
    - !type:NestedSelector
        tableId: MeteorSwarmSmallChanceEventsTable

- type: entityTable
  id: BasicMeteorSwarmEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - !type:NestedSelector
        tableId: MeteorSwarmDustEventsTable
    - id: MeteorSwarmSmall
    - id: MeteorSwarmMedium
    - id: MeteorSwarmLarge
    - id: UristSwarm
    - id: ClownSwarm
    - id: CowSwarm
    - id: PotatoSwarm
    - id: FunSwarm
    - id: ImmovableRodSpawn

- type: weightedRandomEntity
  id: MeteorSpawnAsteroidWallTable
  weights:
    AsteroidRock: 10
    AsteroidRockCoal: 5
    AsteroidRockQuartz: 5
    AsteroidRockTin: 5
    AsteroidRockSilver: 2
    AsteroidRockGold: 2
    AsteroidRockPlasma: 2
    AsteroidRockDiamond: 2
    AsteroidRockUranium: 0.5

# Event Schedulers

- type: entity
  parent: BaseGameRule
  id: MeteorSwarmScheduler
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1200 # 20 min Claw Command
    minMaxEventTiming:
      min: 1200 # Claw Command
      max: 12800 #  Claw Command
    scheduledGameRules: !type:NestedSelector
      tableId: BasicMeteorSwarmEventsTable

- type: entity
  parent: BaseGameRule
  id: MeteorSwarmMildScheduler
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1200 # Claw Command
    minMaxEventTiming:
      min: 1200 #  Claw Command
      max: 12800 #  Claw Command
    scheduledGameRules: !type:NestedSelector
      tableId: MeteorSwarmMildTable

- type: entity
  parent: BaseGameRule
  id: KesslerSyndromeScheduler
  components:
  - type: GameRule
  - type: RampingStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: BasicMeteorSwarmEventsTable

# Game Rules

- type: entity
  parent: BaseGameRule
  id: MeteorSwarm
  abstract: true
  components:
  - type: GameRule
  - type: StationEvent
    reoccurrenceDelay: 1
    earliestStart: 20
    minimumPlayers: 25
  - type: MeteorSwarm

- type: entity
  parent: MeteorSwarm
  id: SpaceDustMinor
  components:
  - type: StationEvent
    weight: 22 # fom 44,  Claw Command
    earliestStart: 20 #Claw Command
    minimumPlayers: 10 # Claw Command - medium dust not til 10 players
  - type: MeteorSwarm
    announcement: null
    announcementSound: null
    nonDirectional: true
    meteors:
      MeteorSpaceDust: 1
    waves:
      min: 2
      max: 3
    meteorsPerWave:
      min: 3
      max: 5

- type: entity
  parent: MeteorSwarm
  id: SpaceDustMajor
  components:
  - type: StationEvent
    weight: 11 # from 22, Claw Command
    earliestStart: 20 # Claw Command
    minimumPlayers: 15 # Claw Command - major dust not til 15 players
  - type: MeteorSwarm
    announcement: station-event-space-dust-start-announcement
    announcementSound: /Audio/Announcements/attention.ogg
    nonDirectional: true
    meteors:
      MeteorSpaceDust: 1
    waves:
      min: 2
      max: 3
    meteorsPerWave:
      min: 8
      max: 12

- type: entity
  parent: MeteorSwarm
  id: MeteorSwarmSmall
  components:
  - type: StationEvent
    weight: 18
    minimumPlayers: 15
  - type: MeteorSwarm
    meteors:
      MeteorSmall: 5 # from 7, Claw Command
      MeteorMedium: 2 # from 3, Claw Command

- type: entity
  parent: MeteorSwarm
  id: MeteorSwarmMedium
  components:
  - type: StationEvent
    weight: 10
    minimumPlayers: 10 # Claw Command - medium meteors not til 10 players
  - type: MeteorSwarm
    meteors:
      MeteorSmall: 2 # from 3, Claw Command
      MeteorMedium: 4 # from 6, Claw Command
      MeteorLarge: 1

- type: entity
  parent: MeteorSwarm
  id: MeteorSwarmLarge
  components:
  - type: StationEvent
    weight: 5
    minimumPlayers: 15 # Claw Command - major meteors not til 15 players
  - type: MeteorSwarm
    meteors:
      MeteorSmall: 1
      MeteorMedium: 3 # from 4, Claw Command
      MeteorLarge: 3 # from 4, Claw Command

- type: entity
  parent: MeteorSwarm
  id: UristSwarm
  components:
  - type: StationEvent
    weight: 0.05
  - type: MeteorSwarm
    announcement: station-event-meteor-urist-start-announcement
    announcementSound: /Audio/Announcements/attention.ogg
    meteors:
      MeteorUrist: 1
    waves:
      min: 3
      max: 3
    meteorsPerWave:
      min: 10
      max: 10

- type: entity
  id: ImmovableRodSpawn
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-immovable-rod-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 3.5
    reoccurrenceDelay: 1
    duration: 1
    earliestStart: 30
    minimumPlayers: 25
  - type: ImmovableRodRule
    rodPrototypes:
    - id: ImmovableRodKeepTilesStill
      prob: 0.94
      orGroup: rodProto
    - id: ImmovableRodMop
      prob: 0.0075
      orGroup: rodProto
    - id: ImmovableRodShark
      prob: 0.0075
      orGroup: rodProto
    - id: ImmovableRodClown
      prob: 0.0075
      orGroup: rodProto
    - id: ImmovableRodBanana
      prob: 0.0075
      orGroup: rodProto
    - id: ImmovableRodHammer
      prob: 0.0075
      orGroup: rodProto
    - id: ImmovableRodThrongler
      prob: 0.0075
      orGroup: rodProto
    - id: ImmovableRodGibstick
      prob: 0.0075
      orGroup: rodProto
    - id: ImmovableRodWeh
      prob: 0.0075
      orGroup: rodProto

