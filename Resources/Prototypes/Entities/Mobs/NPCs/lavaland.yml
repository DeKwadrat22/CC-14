- type: entity
  name: watcher
  id: MobWatcherBase
  parent: [ SimpleSpaceMobBase, FlyingMobBase ]
  abstract: true
  description: It's like it's staring right through you.
  components:
  - type: WeatherImmune # Claw Command - Lavaland
  - type: NpcFactionMember
    factions:
    - Lavafauna # Claw Command - Lavaland (was SimpleHostile)
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Lavaland/watcher.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
          - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
        BaseUnshaded: unshaded
      Dead:
        Base: dead
        BaseUnshaded: dead-unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      140: Dead # Claw Command - Lavaland (was 50)
  - type: Butcherable
    spawned:
    - id: DiamondOre1
      amount: 1
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.65 # Claw Command - Lavaland (was 5)
    baseSprintSpeed: 1.65 # Claw Command - Lavaland (was 7)
  - type: BatteryAmmoProvider # Claw Command - Lavaland (was BatteryAmmoProvider)
    proto: WatcherBolt
    fireCost: 50
  - type: BatterySelfRecharger
    autoRecharge: true # Claw Command - Lavaland
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    projectileSpeed: 10 # Claw Command - Lavaland
    fireRate: 0.2 # Claw Command - Lavaland (was 0.5)
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: CombatMode
  - type: InteractionPopup
    successChance: 0.3
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg
  - type: Fauna # Claw Command - Lavaland

- type: entity
  id: MobWatcherLavaland
  parent: MobWatcherBase
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: unshaded
      shader: unshaded
      color: red
  - type: PointLight
    radius: 1.5 # Claw Command - Lavaland
    energy: 0.5 # Claw Command - Lavaland
    color: red
  - type: Butcherable # Claw Command - Lavaland
    spawned:
    - id: DiamondOre1
    - id: MaterialWatcherWing1
      maxAmount: 2

