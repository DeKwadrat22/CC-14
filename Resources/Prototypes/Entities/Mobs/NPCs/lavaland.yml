    energy: 1 # Claw Command - Lavaland
    color: deepskyblue
  - type: BatteryAmmoProvider # Claw Command - Lavaland
    proto: WatcherBoltIcewing
    fireCost: 50
  - type: Butcherable # Claw Command - Lavaland
    spawned:
    - id: DiamondOre1
    - id: MaterialWatcherIceWing1
