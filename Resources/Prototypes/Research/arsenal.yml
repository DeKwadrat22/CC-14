# Arsenal discipline — tech-tree layout
#
# X axis: tier progression (T1 cols 0-2, T2 cols 4-5, T3 col 7)
# Y axis: themed row clustering inside the Arsenal band (rows 5-9)
#   Row 5  Concentrated energy weapons
#   Row 6  Exotic-particle weapons
#   Row 7  Ballistics & kinetics
#   Row 8  Shuttle armament chain (Salvage → Basic → Advanced)
#   Row 9  Riot, explosives & special equipment

