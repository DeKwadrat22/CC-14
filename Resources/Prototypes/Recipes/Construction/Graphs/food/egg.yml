# egg cooks at moderate heat, then explodes if overheated.
# Claw Command: added intermediate `boiled` node so chefs can produce
# FoodEggBoiled by microwaving briefly (ported from space upstream).
- type: constructionGraph
  id: Egg
  start: start
  graph:
  - node: start
    edges:
    - to: boiled
      steps:
      - minTemperature: 344 # ~70°C — hard-boiled
  - node: boiled
    entity: FoodEggBoiled
    edges:
    - to: explode
      completed:
      - !type:DamageEntity
        damage:
          types:
            Blunt: 10
      steps:
      # explodes once internal pressure climbs above ~110°C
      - minTemperature: 383
  - node: explode
