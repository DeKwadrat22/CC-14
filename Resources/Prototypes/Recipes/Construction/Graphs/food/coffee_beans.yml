# Claw Command — coffee bean roasting graph.
#
# The coffee bean entities in _ClawCommand/Entities/Objects/Consumable/Food/coffee_beans.yml
# already declare `Construction: graph: Coffee, node: <stage>` and ship with
# AtmosExposed + Temperature + InternalTemperature components so a chef can sit
# them on a hot grill/over-burner and watch them progress. The graph below is the
# missing piece that drives those transitions — same heat-driven pattern that
# steak.yml uses for cooked meats.
#
# Node names MUST match the ones the entity files reference verbatim.

- type: constructionGraph
  id: Coffee
  start: start
  graph:
  - node: start
    edges:
    - to: light roasted coffee
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 380 # ~110°C — first crack
  - node: light roasted coffee
    entity: FoodCoffeeBeansRoastedLight
    edges:
    - to: medium roasted coffee
      steps:
      - minTemperature: 425 # ~150°C — between first and second crack
  - node: medium roasted coffee
    entity: FoodCoffeeBeansRoastedMedium
    edges:
    - to: dark roasted coffee
      steps:
      - minTemperature: 475 # ~200°C — full second crack
  - node: dark roasted coffee
    entity: FoodCoffeeBeansRoastedDark
