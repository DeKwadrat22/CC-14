# Claw Command - cube spawns retargeted from Goob's Mob*Random variants to this fork's own
# species mobs; the fork has no random-appearance variants. Cubes for species the fork does
# not have at all (Harpy, Rodentia, Yowie, Chitinid) are removed rather than left pointing at nothing.
