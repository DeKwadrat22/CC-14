# Goob-sprite Deathsquad alts. Hardsuit + helmet parent their vanilla counterparts
# so stats mirror upstream exactly; only the Sprite/Clothing paths swap to the
# _GoobStation art. Magboots alt parents ClothingShoesBootsMagAdv (what the vanilla
# deathsquad loadout uses) and only swaps the sprite.

- type: entity
  parent: ClothingOuterHardsuitDeathsquad
  id: ClothingOuterHardsuitDeathsquadAlt
  components:
  - type: Sprite
    sprite: _GoobStation/Clothing/OuterClothing/Hardsuits/deathsquad.rsi
  - type: Clothing
    sprite: _GoobStation/Clothing/OuterClothing/Hardsuits/deathsquad.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitDeathsquadAlt

- type: entity
  parent: ClothingHeadHelmetHardsuitDeathsquad
  id: ClothingHeadHelmetHardsuitDeathsquadAlt
  components:
  - type: Sprite
    sprite: _GoobStation/Clothing/Head/Hardsuits/deathsquad.rsi
  - type: Clothing
    sprite: _GoobStation/Clothing/Head/Hardsuits/deathsquad.rsi

- type: entity
  parent: ClothingShoesBootsMagAdv
  id: ClothingShoesBootsMagDeathsquadAlt
  components:
  - type: Sprite
    sprite: _GoobStation/Clothing/Shoes/Boots/deathsquad.rsi
    state: icon
  - type: Clothing
    sprite: _GoobStation/Clothing/Shoes/Boots/deathsquad.rsi
  - type: Item
    sprite: _GoobStation/Clothing/Shoes/Boots/deathsquad.rsi
