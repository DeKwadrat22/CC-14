# Goob-sprite ERT hardsuit/helmet alts. Each parents its vanilla counterpart so
# stats stay identical to upstream; only the Sprite/Clothing paths swap to the
# _GoobStation art. Handy as chameleon/locker roll variants alongside the vanilla
# ERT loadout.

# ERT LEADER
- type: entity
  parent: ClothingOuterHardsuitERTLeader
  id: ClothingOuterHardsuitERTLeaderAlt
  components:
  - type: Sprite
    sprite: _GoobStation/Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader.rsi
  - type: Clothing
    sprite: _GoobStation/Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitERTLeaderAlt

- type: entity
  parent: ClothingHeadHelmetHardsuitERTLeader
  id: ClothingHeadHelmetHardsuitERTLeaderAlt
  components:
  - type: Sprite
    sprite: _GoobStation/Clothing/Head/Hardsuits/ERThelmets/ertleader.rsi
  - type: Clothing
    sprite: _GoobStation/Clothing/Head/Hardsuits/ERThelmets/ertleader.rsi

