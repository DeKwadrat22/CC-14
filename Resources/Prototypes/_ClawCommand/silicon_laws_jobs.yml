# CLAW COMMAND - job-flavoured and gimmick lawsets ported from Delta-V.
# Credit: law text written by Delta-V Station 14 (https://github.com/DeltaV-Station/Delta-v).
#
# Every lawset here has a matching law board in
# _ClawCommand/Entities/Objects/Devices/Circuitboards/law_boards.yml, printed at the department the
# lawset belongs to (or the science circuit imprinter when the department has no fabricator of its own).
#
# Delta-V's DungeonMaster and StationEfficiency lawsets are deliberately not ported - they are the same
# laws as our existing GameMasterLawset / EfficiencyLawset, which already have boards.

# Medical

- type: siliconLaw
