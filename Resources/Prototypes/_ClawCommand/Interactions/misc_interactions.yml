- type: Interaction
  id: Bite
  parent: [BaseGlobal, BaseMouth]
  priority: -15 # Non-erp but generally not something you'd want to do to strangers
  delay: 0.4
  cooldown: 5
  globalCooldown: true
  # Very close-range. Claw Command - scales 0.666 (shortest) to 1 (tallest).
  range: {max: 1}
  minHeightRange: 0.666
  hideByRequirement: true
  requirement:
    !type:EntityWhitelistRequirement
    whitelist:
      components: [MobState, Edible] # Don't go around biting inanimate objects.
  action:
    !type:ComplexAction
    actions:
    - !type:ModifyHealthAction
      randomFactor: {min: 0.5, max: 1.5}
      damage:
        types: {Piercing: 5}
  effectSuccess:
    popup: Obvious
    sound:
      path: /Audio/Effects/bite.ogg
      params:
        volume: -3
        maxDistance: 4
  effectFailure:
    popup: Subtle
