# Lighting variants ported from Nyanotrasen for asterisk map (and general decor).
# All require light tube/bulb prototypes that exist in upstream base.

- type: entity
  parent: PoweredlightExterior
  id: PoweredLightBlueInterior
  suffix: Blue Interior
  description: A light fixture. Draws power and produces light when equipped with a light tube.
  components:
  - type: PoweredLight
    hasLampOnSpawn: BlueLightTube
    damage:
      types:
        Heat: 0.2

- type: entity
  parent: Poweredlight
  id: PoweredLightColoredBlack
  suffix: Black
  description: A light fixture. Draws power and produces light when equipped with a light tube.
