- type: entity
  parent: BaseWall
  id: WallPaper
  name: recipes-paper-wall-name
  description: recipes-paper-wall-desc
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Walls/paper.rsi
  - type: Icon
    sprite: Nyanotrasen/Structures/Walls/paper.rsi
  - type: Construction
    graph: Girder
    node: paperWall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: paperwall
