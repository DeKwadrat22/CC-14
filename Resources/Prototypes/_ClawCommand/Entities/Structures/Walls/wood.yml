- type: entity
  parent: BaseWall
  id: N14WallWoodWhite
  name: wooden wall
  components:
  - type: Sprite
    sprite: _ClawCommand/Structures/Walls/woodwhite.rsi
  - type: Icon
    sprite: _ClawCommand/Structures/Walls/woodwhite.rsi
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: wallswood
    base: wood

- type: entity
  parent: N14WallWoodWhite
  id: N14WallWoodDark
  components:
  - type: Sprite
    sprite: _ClawCommand/Structures/Walls/wooddark.rsi
  - type: Icon
    sprite: _ClawCommand/Structures/Walls/wooddark.rsi

- type: entity
  parent: N14WallWoodWhite
  id: N14WallWoodLog
  name: log wall
  description: A wall made out of wooden logs.
  components:
  - type: Sprite
    sprite: _ClawCommand/Structures/Walls/woodlognew.rsi
  - type: Icon
    sprite: _ClawCommand/Structures/Walls/woodlognew.rsi
  - type: IconSmooth
    key: log
    base: log
