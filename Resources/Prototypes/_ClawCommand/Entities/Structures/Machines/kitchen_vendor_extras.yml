# Ported from Nyanotrasen/Entities/Structures/Machines/{deep_fryer,laundry,
# vending_machines}.yml, DeltaV/NPC/roboisseur.yml, and the upstream
# Entities/Structures/Machines/lathe.yml (PrizeCounter).
#
# The following component types referenced by the originals are NOT present in
# this fork's C# code, so they're stripped to keep the entities loadable:
#   - DeepFryer, WashingMachine, Shower, Roboisseur, Advertise (Roboisseur),
#     EmptyOnMachineDeconstruct (DeepFryer), PowerSwitch, GenericVisualizer (WM),
#     BaseMaterialSiloUtilizer (PrizeCounter parent).
# Removed components are flagged inline. These entities will spawn as visual /
# storage / static props on the CentComm map.

# --- Kitchen ---

- type: entity
  id: KitchenDeepFryer
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: deep fryer
  description: An industrial deep fryer. A big hit at state fairs!
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    netsync: false
    sprite: Nyanotrasen/Structures/Machines/deep_fryer.rsi
    layers:
    - state: off-0
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: off-1
  - type: AmbientSound
    volume: -4
    range: 5
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: SolutionContainerVisuals
    maxFillLevels: 8
    fillBaseName: off-
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
    rotateWhilePulling: false
  - type: Physics
    bodyType: Static
  - type: Climbable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.30,-0.25,0.30,0.45"
        density: 600
        mask:
        - MachineMask
        layer:
        - MachineLayer
  # DeepFryer component dropped — system not present.
  - type: SolutionContainerManager
    solutions:
      vat_oil:
        maxVol: 100
  - type: DrainableSolution
    solution: vat_oil
  - type: ExaminableSolution
    solution: vat_oil
  - type: InjectableSolution
    solution: vat_oil
  - type: RefillableSolution
    solution: vat_oil
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpillBehavior
        solution: vat_oil
      - !type:SpawnEntitiesBehavior
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: ContainerContainer
    containers:
      vat_entities: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container

# --- Laundry ---

- type: entity
  id: WashingMachine
  parent: BaseStructureDynamic
  name: washing machine
  description: A machine that washes clothes with a spinning steel drum in a shiny frame.
  components:
  - type: Sprite
    noRot: true
    sprite: Nyanotrasen/Structures/Machines/washer.rsi
    layers:
    - state: "normal-base"
    - state: "normal-closed"
  # GenericVisualizer & WashingMachine dropped — engine/system not present.
  - type: Appearance
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.25,0.35,0.49"
        density: 600
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Climbable
    delay: 1.6
  - type: Storage
    maxItemSize: Normal
    grid:
      - 0,0,5,5
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: Repairable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

# --- Shower ---

- type: entity
  name: shower
  id: Shower
  description: A shower, complete with bluespace water.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
    - type: Sprite
      sprite: Structures/Furniture/shower.rsi
      drawdepth: WallMountedItems
      layers:
      - state: shower
    - type: Appearance
    - type: Rotatable
    - type: Transform
      noRot: false
    - type: Clickable
    # Shower component dropped — system not present.
    - type: Physics
      bodyType: Static
      canCollide: false
    - type: InteractionOutline
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]

# --- Boxing Drobe Vendor + inventory ---

- type: vendingMachineInventory
  id: BoxingDrobeInventory
  startingInventory:
    UniformShortsRed: 3
    UniformShortsRedWithTop: 3
    ClothingHandsGlovesBoxingRed: 2
    ClothingHandsGlovesBoxingBlue: 2
    ClothingHandsGlovesBoxingGreen: 2
    ClothingHandsGlovesBoxingYellow: 2
  emaggedInventory:
    UniformJabroni: 2

- type: entity
  parent: VendingMachine
  id: VendingMachineBoxingDrobe
  name: Boxing Drobe
  description: Always short on stock.
  components:
  - type: VendingMachine
    pack: BoxingDrobeInventory
  - type: Sprite
    sprite: Nyanotrasen/Structures/Machines/VendingMachines/boxingdrobe.rsi
    layers:
    - state: off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: normal-unshaded
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
    access: [["Boxer"]]

# --- Roboisseur ---

- type: entity
  parent: BaseStructure
  id: Roboisseur
  name: Mr. Butlertron
  description: It asks for food to deliver to exotic customers across the cosmos. Powered by the latest technology in bluespace food delivery.
  components:
  - type: Anchorable
  - type: Pullable
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: DeltaV/Structures/Machines/roboisseur.rsi
    layers:
    - state: roboisseur-1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Roboisseur component dropped — system not present in this fork.
  - type: Speech
    speechSounds: Pai
  - type: Appearance
  - type: Grammar
    attributes:
      gender: male
      proper: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

# --- Prize Counter (toy lathe) ---
# Original parent BaseMaterialSiloUtilizer doesn't exist in this fork; the silo
# integration is dropped and only the base lathe parent is kept. Recipe list is
# minimised to entities known to exist in this fork.

- type: entity
  parent: BaseLathe
  id: PrizeCounter
  name: prize counter
  description: Claim your prize and win some toys and cute plushies!
  components:
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#4b93ad"
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: Structures/Machines/prizecounter.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    # staticRecipes/idleState/runningState dropped — this fork's Lathe data
    # model uses StaticPacks/DynamicPacks (LatheRecipePackPrototype) instead.
    # Leaving empty is fine for spawning the entity.
