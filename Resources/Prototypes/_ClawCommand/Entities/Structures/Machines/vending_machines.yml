# Ported from sibling SS14 project ("space") so the corresponding inventory packs
# under Resources/Prototypes/Catalog/VendingMachines/Inventories/ aren't dangling.
# Locale-backed Ads/Goodbyes datasets from the source weren't ported (out of scope),
# so these entities omit DatasetVocalizer/SpeakOnUIClosed components and fall back
# to the base VendingMachine's generic Vocalizer/SpookySpeaker.

- type: entity
  id: VendingMachineFitness
  parent: VendingMachine
  name: SweatMAX
  description: An exercise aid and nutrition supplement vendor that preys on your inadequacy.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/VendingMachines/fitness.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: "screen"
      map: ["enum.VendingMachineVisualLayers.Screen"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: VendingMachine
    pack: FitnessVendInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
    ejectState: eject-unshaded
    screenState: screen
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: true
  - type: PointLight
    radius: 2
    energy: 1.6
    color: "#9dc5c9"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true

