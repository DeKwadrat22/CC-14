# Unlocked variant of the Booze-O-Mat - same sprite/inventory as the bartender's,
# but no AccessReader. Uses the BoozeOMatUnlockedInventory pack which has slightly
# different stock (extra glassware, jugs, ClawCommand's signature drink).
- type: entity
  parent: VendingMachine
  id: VendingMachineBoozeUnlocked
  name: Booze-O-Mat
  description: A technological marvel, supposedly able to mix just the mixture you'd like to drink the moment you ask for one.
  suffix: Unlocked
  components:
  - type: VendingMachine
    pack: BoozeOMatUnlockedInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
    loopDeny: false
  - type: DatasetVocalizer
    dataset: BoozeOMatAds
  - type: SpeakOnUIClosed
    pack: BoozeOMatGoodbyes
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/boozeomat.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
