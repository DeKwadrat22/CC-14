# Ported from upstream forks (DeltaV / Nyanotrasen / Floof / _NF / Nuclear14 / SimpleStation).
# Brought in for the glacier map port.

# --- SolidReinforcedSecretDoor -> EESolidReinforcedSecretDoor ---
- type: entity
  id: EESolidReinforcedSecretDoor
  name: reinforced wall
  parent: BaseSecretDoor
  components:
  - type: Construction
    graph: ReinforcedSecretDoorGraph
    node: ReinforcedSecretDoorNode
    containers:
    - battery-container
  - type: Sprite
    sprite: _NF/Structures/Doors/secret_door_reinforced.rsi

#wood secret door

# --- WoodSecretDoor -> EEWoodSecretDoor ---
- type: entity
  id: EEWoodSecretDoor
  name: wood wall
  parent: BaseSecretDoor
  components:
  - type: Sprite
    sprite: _NF/Structures/Doors/secret_door_wood.rsi
  - type: Construction
    graph: WoodSecretDoorGraph
    node: WoodSecretDoorNode
    containers:
    - battery-container

