# FLOOF: Create a gas mask base class so that the MaskGas tag doesn't pass onto children
- type: entity
  id: GasMaskTags
  abstract: true
  components:
  - type: Tag
    tags:
    - HamsterWearable
    - WhitelistChameleon
    - HidesNose

- type: entity
  parent: [ GasMaskTags, ClothingMaskPullableBase ]
  id: ClothingMaskGasBase
  abstract: true
  name: gas mask
  description: A face-covering mask that can be connected to an air supply.
  components:
  - type: Sprite
    sprite: Clothing/Mask/gas.rsi
  - type: Clothing
    sprite: Clothing/Mask/gas.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Snout
    hideOnToggle: true
# END FLOOF

- type: entity
  parent: ClothingMaskGasExplorer
  id: ClothingMaskGasCaptainCombat
  name: captain's combat gas mask
  description: A military-grade gas mask that can be connected to an air supply, painted and outfitted with an emblem befitting its wearer. Issued only to the station's finest.
  components:
  - type: Sprite
    sprite: Clothing/Mask/gascaptaincombat.rsi
  - type: Clothing
    sprite: Clothing/Mask/gascaptaincombat.rsi

- type: entity
  parent: ClothingMaskNeckGaiter
  id: ClothingMaskNeckGaiterWhite
  name: neck gaiter
  components:
  - type: Sprite
    sprite: Clothing/Mask/neckgaiterwhite.rsi
  - type: Clothing
    sprite: Clothing/Mask/neckgaiterwhite.rsi

