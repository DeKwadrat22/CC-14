# Claw Command - clothing imported from the Imperial Space public tree (imperial-space/SS14-public).
#
# Only entities whose sprite meta.json grants a Creative Commons licence are here; anything marked ICLA,
# or with no licence field at all, was deliberately left behind. The artwork keeps its original
# Resources/Textures/Imperial/... path and its meta.json travels with it, so attribution stays intact.
# These prototypes are our own - regenerated into this fork's layout rather than copied - and nothing
# outside this folder was modified to make them work.
#
# Source module: SpiderClan
# Do not hand-edit in bulk; this file was generated from the survey and can be regenerated.

- type: entity
  id: AltJumpsuitNinja
  parent: UnsensoredClothingUniformBase
  name: "ninja jumpsuit"
  description: "A comfortable ninja costume, for comfort while directly carrying out your mission."
  suffix: "Crook, SpiderClan"
  components:
  - type: Sprite
    sprite: Imperial/SpiderClan/Clothing/Default/Jumpsuits/ninjaalt.rsi
  - type: Clothing
    sprite: Imperial/SpiderClan/Clothing/Default/Jumpsuits/ninjaalt.rsi
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.95
  - type: StaticPrice
    price: 700

- type: entity
  id: BlueAltHelmetSpaceNinja
  parent:
  - ClothingHeadBase
  - BaseMajorContraband
  name: "space ninja mask"
  description: "A nano-weave mask based on the Spider Clan's most advanced technology, capable of protecting against depressurisation despite its openness. It glows with a blue light."
  suffix: "Crook, SpiderClan"
  components:
  - type: Sprite
    sprite: Imperial/SpiderClan/Clothing/Alternative/Helmets/blueninja.rsi
  - type: Clothing
    sprite: Imperial/SpiderClan/Clothing/Alternative/Helmets/blueninja.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.2
    coolingCoefficient: 0.2

- type: entity
  id: BlueAltSuitSpaceNinja
