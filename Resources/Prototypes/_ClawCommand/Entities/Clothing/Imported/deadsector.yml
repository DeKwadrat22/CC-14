  parent:
  - BaseItem
  - FlashlightLantern
  name: "foldapbe light post"
  description: "Gudies you trough the abyss of darkness!"
  components:
  - type: Item
    storedRotation: -90
    size: Large
    shape:
    - "0,0,2,2"
  - type: Sprite
    sprite: Imperial/DeadSector/location_objects/foldable_light_post.rsi
    noRot: true
    layers:
    - state: post-off
      map:
      - unfoldedLayer
    - state: post-folded
      map:
      - foldedLayer
      visible: false
    - state: post-on
      map:
      - light
      visible: false
  - type: Rotatable
  - type: MovedByPressure
  - type: DamageOnHighSpeedImpact
    soundHit:
      collection: MetalThud
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 190
        mask:
        - MobMask
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 78
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 5
  - type: Pullable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FoldedVisuals.State:
        foldedLayer:
          True:
            visible: true
          False:
            visible: false
        unfoldedLayer:
          True:
            visible: false
          False:
            visible: true
        light:
          True:
            visible: false
          False:
            visible: true

