- type: entity
  id: AdvancedStunbaton
  parent: Stunbaton
  name: "stun baton"
  description: "A stun baton for incapacitating people with. Actively harming with this is considered bad tone."
  components:
  - type: Sprite
    sprite: Imperial/Objects/Weapons/Melee/AdvancedStunBaton/stunbaton.rsi
  - type: Stunbaton
    energyPerUse: 25
  - type: Battery
    maxCharge: 2000
    startingCharge: 2000

- type: entity
  id: ClothingUniformJumpStinky
  parent: ClothingUniformBase
  name: "grey jumpsuit"
  description: "A tasteful grey jumpsuit that reminds you of the good old days."
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/color.rsi
    layers:
    - state: icon
      color: "#b3b3b3"
    - state: trinkets-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#b3b3b3"
      - state: trinkets-inhand-left
      right:
      - state: inhand-right
        color: "#b3b3b3"
      - state: trinkets-inhand-right
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/color.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#b3b3b3"
      - state: trinkets-equipped-INNERCLOTHING

