- type: entity
  id: AdvancedStunbatonBorg
  parent: Stunbaton
  name: "ert borg stun baton"
  description: "A stun baton for incapacitating people with. Actively harming with this is considered bad tone."
  components:
  - type: Sprite
    sprite: Imperial/Objects/Weapons/Melee/AdvancedStunBaton/stunbaton.rsi
  - type: Stunbaton
    energyPerUse: 25
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 0
    bluntStaminaDamageFactor: 2.0
    angle: 60
    animation: WeaponArcThrust
  - type: Battery
    maxCharge: 200
    startingCharge: 200
  - type: BatterySelfRecharger
    autoRechargeRate: 10

