# Ported from upstream forks (DeltaV / Nyanotrasen / Floof / _NF / Nuclear14 / SimpleStation).
# Brought in for the glacier map port.

# --- ClothingHeadHelmetInsulated ---
- type: entity
  parent: ClothingHeadTinfoil
  id: ClothingHeadHelmetInsulated
  name: insulative skullcap
  description: Psionically insulates whoevers head is inside it. It has some protection from physical damage.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/Head/Helmets/insulative_skullcap.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/Head/Helmets/insulative_skullcap.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.95
        Radiation: 0.95

# --- ClothingHeadHelmetPilot ---
- type: entity
  parent: ClothingHeadEVAHelmetBase
  id: ClothingHeadHelmetPilot
  name: Freelancer "Pilot" Helmet
  description: A robust helmet designed for extravehicular activites. This version has a issue with the visor flashing from time to time.
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Floof/Clothing/Head/pilothelmet.rsi
  - type: Clothing
    sprite: _Floof/Clothing/Head/pilothelmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

# --- ClothingHeadTinfoil ---
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadTinfoil
  name: tinfoil hat
  description: Protects you from all manner of psionic assaults.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/Head/Hats/tinfoil.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/Head/Hats/tinfoil.rsi
  # Stripped: TinfoilHat (Nyanotrasen psionic component not in this fork)
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.95
  # Stripped: Construction (TinfoilHat graph relies on the missing component)

