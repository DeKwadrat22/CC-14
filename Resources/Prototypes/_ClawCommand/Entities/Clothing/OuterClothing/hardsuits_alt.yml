# Spationaut Hardsuit Helmet
# Matches the layout used by the fork's vanilla ClothingHeadHelmetHardsuitSpatio so the
# visor unshaded glow and head-light overlay render correctly. The original port carried
# only a flat single-layer Sprite/Clothing pair from upstream, which made the worn helmet
# show as a flat silhouette with no visor glow or togglable light.
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitSpatioAlt
  name: spationaut hardsuit helmet
  description: A sturdy helmet designed for complex industrial operations in space.
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _ClawCommand/Clothing/Head/Hardsuits/spatiohelm.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
      head-vox:
      - state: equipped-head-light-vox
        shader: unshaded
  - type: Clothing
    sprite: _ClawCommand/Clothing/Head/Hardsuits/spatiohelm.rsi
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-head-vox
      - state: equipped-head-unshaded-vox
        shader: unshaded
      head-vulpkanin:
      - state: equipped-head-vulpkanin
      head-feroxi:
      - state: equipped-head-feroxi
  - type: PointLight
    radius: 6
  - type: PressureProtection
    highPressureMultiplier: 0.72
    lowPressureMultiplier: 1000

