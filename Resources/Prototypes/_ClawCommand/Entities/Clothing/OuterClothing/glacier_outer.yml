# Ported from upstream forks (DeltaV / Nyanotrasen / Floof / _NF / Nuclear14 / SimpleStation).
# Brought in for the glacier map port.

# --- ClothingOuterApronChemist ---
- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterApronChemist
  name: chemical resistant apron
  suffix: Chemistry
  description: Made out of thick rubber, the color of this apron still leaves you perplexed.
  components:
  - type: Sprite
    sprite: DeltaV/Clothing/OuterClothing/Misc/chemapron.rsi
  - type: Clothing
    sprite: DeltaV/Clothing/OuterClothing/Misc/chemapron.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.25
  - type: TemperatureProtection
    coolingCoefficient: 1
    heatingCoefficient: 1

