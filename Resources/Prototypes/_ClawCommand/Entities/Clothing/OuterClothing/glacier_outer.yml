# --- ClothingOuterHardsuitFreelancerPilot ---
- type: entity
  parent: [ClothingOuterEVASuitBase, ClothingOuterStorageBase]
  id: ClothingOuterHardsuitFreelancerPilot
  name: FL-02bt - "Pilot" Freelancer Softsuit
  description: A armored soft suit. "Maximum speed for minimal protection."
  components:
  - type: Sprite
    sprite: _Floof/Clothing/OuterClothing/Hardsuits/softsuitpilot.rsi
  - type: Clothing
    sprite: _Floof/Clothing/OuterClothing/Hardsuits/softsuitpilot.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.7
        Heat: 0.8
        Caustic: 0.8
        Radiation: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  # Stripped: StaminaDamageResistance (component not present in this fork)

