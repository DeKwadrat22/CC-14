# Claw Command custom winter coats.
# ClothingOuterWinterCCWarden was removed during the 48h port churn but is meant
# to stay. Restored from git history (commit 5f09ee60b8). Sprite folder still
# on disk at _ClawCommand/Clothing/OuterClothing/WinterCoats/cc_warden_winter_coat.rsi.

- type: entity
  parent: ClothingOuterWinterCoat
  id: ClothingOuterWinterCCWarden
  name: central command's armored winter coat
  description: A tough, utilitarian coat designed for the wardens of Central Command. Reinforced kevlar plating and high quality fur allow the user to look stylish while staying protected.
  components:
  - type: Sprite
    sprite: _ClawCommand/Clothing/OuterClothing/WinterCoats/cc_warden_winter_coat.rsi
  - type: Clothing
    sprite: _ClawCommand/Clothing/OuterClothing/WinterCoats/cc_warden_winter_coat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.4
        Heat: 0.75
