# Claw Command - Ported from Floofstation
- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsMusicianWarmers
  name: musician arm-warmers
  description: A pair of rather nice arm-warmers, styled for musicians.
  components:
  - type: Sprite
    sprite: _ClawCommand/Clothing/Departmental/Service/musicianwarmer.rsi
  - type: Clothing
    sprite: _ClawCommand/Clothing/Departmental/Service/musicianwarmer.rsi
  - type: Fiber
    fiberMaterial: fibers-synthetic
    fiberColor: fibers-purple
  - type: FingerprintMask

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsStripeWhiteWarmers
  name: striped white arm-warmers
  description: A pair of rather nice arm-warmers.
  components:
  - type: Sprite
    sprite: _ClawCommand/Clothing/Under/Gloves/stripewarmerwhite.rsi
  - type: Clothing
    sprite: _ClawCommand/Clothing/Under/Gloves/stripewarmerwhite.rsi
  - type: Fiber
    fiberMaterial: fibers-synthetic
    fiberColor: fibers-white
  - type: FingerprintMask

