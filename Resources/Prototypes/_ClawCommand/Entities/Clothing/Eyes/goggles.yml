# NightVision / ThermalVision goggle entities ported from Goobstation under AGPL-3.0-or-later.
# Components live in Content.Goobstation.Shared.Overlays (see Content.Shared/_ClawCommand/Overlays/).

- type: entity
  parent: [ClothingEyesBase, BaseSecurityContraband]
  id: ClothingEyesNightVisionGoggles
  name: night vision goggles
  description: Civilian-grade light-amplifying goggles. Lets you see in low light without burning out your retinas.
  components:
  - type: Sprite
    sprite: _ClawCommand/Clothing/Eyes/Goggles/nightvision.rsi
  - type: Clothing
    sprite: _ClawCommand/Clothing/Eyes/Goggles/nightvision.rsi
  - type: NightVisionOverlay
    isEquipment: true
  - type: Tag
    tags:
    - WhitelistChameleon

- type: entity
  parent: [ClothingEyesBase, BaseSecurityContraband]
  id: ClothingEyesNightVisionSecurityGoggles
