# CLAW COMMAND - law boards for the job / gimmick lawsets in _ClawCommand/silicon_laws_jobs.yml.
#
# Credit: law text written by Delta-V Station 14 (https://github.com/DeltaV-Station/Delta-v).
#
# These slot into an AI upload console like any other law board, and - unlike upstream - into a borg
# chassis with its panel unscrewed and its lock open (see BorgLawBoardSystem).
#
# Printing: department boards come out of that department's fabricator, everything else out of the
# science circuit imprinter. Recipes live in _ClawCommand/Recipes/Lathes/law_boards.yml.

- type: entity
  id: MedicalCircuitBoard
  parent: BaseSiliconLawboard
  name: law board (Medical)
  description: An electronics board containing the Medical lawset.
  components:
  - type: SiliconLawProvider
    laws: Medical

