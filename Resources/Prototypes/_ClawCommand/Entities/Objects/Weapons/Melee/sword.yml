- type: entity
  name: maid katana
  parent: [ BaseSword, BaseCommandContraband ]
  id: WeaponMeleeKatana
  description: A katana made specifically for the Claw Command Maid. Has a toggle between stun and slicing.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/katana.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 12
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    heldPrefix: off
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/katana_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: Clothing
    sprite: Objects/Weapons/Melee/katana.rsi
    slots:
    - Back
    - Belt
  - type: DisarmMalus
    malus: 0.225
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 0
  - type: UseDelay
  - type: StaminaDamageOnHit
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: StaminaDamageOnCollide
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: LandAtCursor # it deals stamina damage when thrown
  - type: StaminaDamageOnHitRequiresToggle
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Tag
    tags:
    - Katana

# CentComm's officer sabre
- type: entity
  name: CentComm's officer sabre
  parent: [ BaseSword, BaseCentcommContraband ]
  id: CentcommSabre
  suffix: CentComm
  description: A specially designed steel-uranium allowing for fast, precise strikes. It has the CentComm logo on it. Clean after use.
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Weapons/Melee/centcomm_sabre.rsi
  - type: MeleeWeapon
    attackRate: 1.69
    damage:
      types:
        Slash: 14
        Radiation: 4 # uranYUM
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .314159265
    spread: 90
  - type: Item
    storedSprite:
      state: storage
      sprite: _ClawCommand/Objects/Weapons/Melee/centcomm_sabre_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: Tag
    tags:
    - CentCommSabre
  - type: DisarmMalus
