    sprite: _ClawCommand/Objects/Weapons/Guns/Battery/svalinn.rsi
    size: Small
    shape:
    - 0,0,1,1
  - type: Gun
    selectedMode: FullAuto
    fireRate: 4
    availableModes:
      - SemiAuto
      - FullAuto
    minAngle: 5
    maxAngle: 30
    angleIncrease: 5
    angleDecay: 20
  - type: Construction
    graph: SvalinnPDWGraph
    node: svalinnPDW
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true

# ---------------------------------------------------------------------------
# from Resources/Prototypes/_Floof/Entities/Objects/Weapons/Melee/brassnuckles.yml
# ---------------------------------------------------------------------------

- type: entity
  name: brass knuckles
  parent: ClothingHandsBase
  id: WeaponBrassKnuckles
  description: Ever wanted to protect your bar but your hands are too big for guns? SESWC has what you need!
  components:
  - type: Sprite
    sprite: _Floof/Objects/Weapons/Melee/brassknuckles.rsi
    state: icon
  - type: Clothing
    sprite: _Floof/Objects/Weapons/Melee/brassknuckles.rsi
  - type: MeleeWeapon
    autoAttack: true
    attackRate: 2 # ~12 dps
    damage:
      types:
       Blunt: 6
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    mustBeEquippedToUse: true
  - type: StaminaDamageOnHit
    damage: 11
  - type: Armor
    modifiers:
      coefficients:
        Shock: 1.05 # oh no so conductive
  - type: Insulated
    coefficient: 1.5 # Extra damage. Don't punch wires, kids.
  - type: Tag
    tags:
    - WhitelistChameleon
    - BrassKnuckles
  - type: PhysicalComposition
    materialComposition:
      Brass: 1000
  - type: StaticPrice
    price: 300 # Ensures these can be sold and have a reasonable vending value.

