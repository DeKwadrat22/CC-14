# _ClawCommand: base weapons and ammunition backing the service-weapon loadouts, ported from
# the `space` fork (DeltaV / Nyanotrasen / Frontier / Goobstation / Floof content it carries).
#
# These are the ordinary, contraband-as-upstream-intended items. The non-contraband "CC issued"
# and "barkeep issued" variants that the loadouts actually hand out live in
# _ClawCommand/Entities/Objects/Weapons/issued_weapons.yml.
#
# NOT ported: WeaponEnergyRevolver. It needs two C# components this fork does not have -
# ProjectileBatteryAmmoProvider (shared gun plumbing) and EnergyGun (fire-mode switching,
# plus an EnergyGunFireModeVisuals enum). That is a gun-system port in its own right, not a
# prototype copy, so the energy revolver is left out of the service-weapon catalogue.

# ---------------------------------------------------------------------------
# from Resources/Prototypes/DeltaV/Entities/Objects/Weapons/Guns/Ammunition/Cartridges/special.yml
# ---------------------------------------------------------------------------

- type: entity
  id: BaseCartridgeSpecial
  name: cartridge (.38 special)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - CartridgeSpecial
  - type: CartridgeAmmo
    proto: BulletSpecial
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  id: CartridgeSpecial
  name: cartridge (.38 special)
  parent: BaseCartridgeSpecial
  components:
  - type: CartridgeAmmo
    proto: BulletSpecial

# ---------------------------------------------------------------------------
# from Resources/Prototypes/DeltaV/Entities/Objects/Weapons/Guns/Ammunition/Projectiles/special.yml
# ---------------------------------------------------------------------------

- type: entity
  id: BulletSpecial
  name: bullet (.38 special)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 30

