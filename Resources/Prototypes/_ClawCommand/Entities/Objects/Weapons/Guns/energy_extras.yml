# Ported from DeltaV/Entities/Objects/Weapons/Guns/Battery/battery_guns.yml.
# This fork doesn't have an EnergyGun component or the BulletEnergyGunLaser
# projectile; the EnergyGun firemode component is dropped and lethal mode is
# substituted with BulletLaser (the standard laser projectile).

- type: entity
  name: energy gun
  parent: BaseWeaponBattery
  id: WeaponEnergyGun
  description: "A basic hybrid energy gun with two settings: disable and kill."
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/Battery/energygun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: DeltaV/Objects/Weapons/Guns/Battery/energygun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/DeltaV/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/DeltaV/Weapons/Guns/Empty/dry_fire.ogg
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 50
  # EnergyGun firemode component dropped (system not present); the weapon
  # fires only the default disabler projectile defined above.
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance

- type: entity
  name: miniature energy gun
  parent: BaseWeaponBatterySmall
  id: WeaponEnergyGunMini
  description: A light version of the Energy gun with a smaller capacity.
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/Battery/mini_energygun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: DeltaV/Objects/Weapons/Guns/Battery/mini_energygun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/DeltaV/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/DeltaV/Weapons/Guns/Empty/dry_fire.ogg
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 50
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Blunt: 7.5
    bluntStaminaDamageFactor: 1.0
    wideAnimationRotation: 135
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5

