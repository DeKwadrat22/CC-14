# _ClawCommand: non-contraband "issued" variants of the service weapons.
#
# The base guns inherit a Contraband component from Base*Contraband parents, and SS14 entity
# prototypes have no way to remove an inherited component - ContrabandComponent always renders
# its examine entry, and AllowedDepartments only changes the wording from "avoid carrying" to
# "in the clear". So anything whose contraband comes from a direct parent is re-parented past
# that base here and restates its own component block; anything already clean just inherits.
#
# Generated to mirror the source entities exactly - if you retune a base gun, retune its issued
# twin to match.

- type: entity
  parent: BaseItem
  id: TruncheonCCIssued
  name: CC issued truncheon
  description: A rigid, steel-studded baton, meant to harm. Issued to a Claw Command service member; carrying it on duty is authorised.
  suffix: CC Issued
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/truncheon.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 20
    soundHit:
      collection: MetalThud
    bluntStaminaDamageFactor: 1.5
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - Truncheon
  - type: Clothing
    sprite: Objects/Weapons/Melee/truncheon.rsi
    quickEquip: false
    slots:
    - Belt
  - type: DisarmMalus
    malus: 0.225
  - type: Appearance
  - type: StaticPrice
    price: 80
  - type: GuideHelp
    guides:
    - Security
    - Antagonists

- type: entity
  parent: BaseMeleeWeaponEnergy
