## Plushies

- type: entity
  parent: BasePlushie
  id: PlushieJester #Weh!
  name: jester plushie
  description: A dubious little creature getting up to mischief.
  components:
  - type: Sprite
    sprite: Objects/Fun/toys.rsi
    state: plushie_jester

- type: entity
  parent: BasePlushie
  id: PlushieSlips
  name: janitor plushie
  description: The silent cleaner, the one that you dont hear say "Weh"!
  components:
  - type: Sprite
    sprite: Objects/Fun/toys.rsi
    state: plushie_slips
  - type: EmitSoundOnUse
    sound:
  - type: EmitSoundOnLand
    sound:
  - type: EmitSoundOnActivate
    sound:
  - type: MeleeWeapon
    soundHit:
  - type: Tag
    tags:
    - Soap
  - type: Slippery
  - type: StepTrigger
    intersectRatio: 0.2
  - type: CollisionWake
    enabled: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        layer:
        - SlipLayer
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        density: 10
        mask:
        - ItemMask

