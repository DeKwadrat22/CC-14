## Cheapo Figurines

- type: entity
  parent: BaseItem
  id: BaseFigurineCheapo
  name: figurine
  description: A small miniature.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Fun/toys.rsi
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: StaticPrice
    price: 25
  - type: Tag
    tags:
    - Figurine

- type: entity
  abstract: true
  parent: BaseItem
  id: FoamWeaponBase
  components:
  - type: Sprite
  - type: Item
    size: Normal

- type: entity
  parent: BaseItem
  id: ToyGunBase
  name: ToyGunBase
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite

- type: entity
  parent: ToyHammer
  id: BwoinkHammer
  name: bwoink hammer
  description: A toy hammer which makes a wildly terrifying sound. It is missing it's old spirit of bangammer and is still unraisinable.
  suffix: DO NOT MAP
  components:
    - type: Sprite
      sprite: Objects/Fun/bwoink_hammer.rsi
      state: icon
    - type: Item
      size: Small
      sprite: Objects/Fun/bwoink_hammer.rsi
    - type: MeleeWeapon
      soundHit:
        collection: ToySqueak
        params:
            variation: 0.03
            volume: 3
      soundNoDamage:
        collection: ToySqueak
        params:
            variation: 0.03
            volume: 3
      damage:
        types:
          Blunt: 0

- type: entity
  name: The Throngler
  parent: ToyHammer
  id: ThronglerToy
  suffix: Toy
  description: Why would you make this?
  components:
    - type: Sprite
      sprite: Objects/Weapons/Melee/Throngler2.rsi
      state: icon
    - type: StaminaDamageOnHit
      damage: 0.8
    - type: MeleeWeapon
      wideAnimationRotation: -135
      attackRate: 10 # Floofstation - this is hertz, not seconds
      damage:
        types:
          Blunt: 0
      soundHit:
        path: /Audio/Effects/explosion_small1.ogg
      soundNoDamage:
        path: /Audio/Effects/explosion_small1.ogg
    - type: Item
      size: Ginormous
      sprite: Objects/Weapons/Melee/Throngler-in-hand.rsi
    - type: DisarmMalus
      malus: 0

- type: entity
  parent: BasePlushie
  id: PlushieMort
  name: morty plushie
  description: A plushie of the lovely Morty. It's a resilient, yet sensitive type of plush.
  components:
    - type: Sprite
      sprite: Objects/Fun/toys.rsi
      state: mortplush

- type: entity
  parent: BasePlushie
  id: PlushieHarpy
  name: harpy plushie
  description: A soft plushie of a harpy! A small tag on it guarantees that all feathers are ethically sourced.
  components:
  - type: Sprite
    sprite: Objects/Fun/toys.rsi
    state: harpyplushie
  - type: StaminaDamageOnHit
    damage: 0.8
  - type: EmitSoundOnActivate
    sound:
      collection: ToySqueak
      params:
        variation: 0.05
  - type: EmitSoundOnUse
    sound:
      collection: ToySqueak
  - type: EmitSoundOnCollide
    sound:
      collection: ToySqueak
      params:
        variation: 0.05
  - type: EmitSoundOnLand
    sound:
      collection: ToySqueak
      params:
        variation: 0.05
  - type: UseDelay
    delay: 0.8
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 2 # Floofstation - this is hertz, not seconds
    damage:
      types:
        Blunt: 0
    soundHit:
      collection: ToySqueak
      params:
        variation: 0.05
    soundSwing:
      collection: ToySqueak
      params:
        variation: 0.05
    soundNoDamage:
      collection: ToySqueak
      params:
        variation: 0.05

# Claw Command originals (Steele, Mattew, Stefanie) - audio refs sanitized for upstream compat
- type: entity
  parent: BasePlushie
  id: PlushieSteele
  name: Steele plushie
  description: A stuffed toy of Steele Sharpclaw!
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Fun/steele_plushie.rsi
    state: steele
  - type: Item
    heldPrefix: steele
  - type: UseDelay
    delay: 3.0

- type: entity
  parent: BasePlushie
  id: PlushieMattew
  name: Mattew Chief plushie
  description: A much more pettable version of Mattew Chief. It seems like it had a ruff day.
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Fun/mattew_plushie.rsi
    state: mattew-plushie
  - type: Item
    heldPrefix: mattew
  - type: UseDelay
    delay: 3.0

- type: entity
  parent: BasePlushie
  id: PlushieStefanie
  name: Stefanie plushie
  description: This plushie seems... evil. You have no clue why.
  components:
  - type: Sprite
