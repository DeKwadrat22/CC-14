# Ported from sibling SS14 fork. Seed packet entities for plants defined in
#   _ClawCommand/Hydroponics/seeds_extras.yml.

# ===== _NF =====

- type: entity
  parent: SeedBase
  name: packet of spesos seeds
  description: "these seeds seem like a miracle, but expert farmers get rich from the kitchen."
  id: SpesosTreeSeeds
  components:
    - type: Seed
      seedId: spesos
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/spesostree.rsi

- type: entity
  parent: SeedBase
  name: packet of pear seeds
  description: "they are peary good for you."
  id: PearSeeds
  components:
    - type: Seed
      seedId: pear
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/pear.rsi

- type: entity
  parent: SeedBase
  name: packet of coffee seeds
  description: Perfect for any self-respecting coffee roaster.
  id: CoffeeSeeds
  components:
    - type: Seed
      seedId: coffee
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi

- type: entity
  parent: SeedBase
  name: packet of avocado seeds
  description: These seeds are the pits.
  id: AvocadoSeeds
  components:
    - type: Seed
      seedId: avocado
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/avocado.rsi

- type: entity
  parent: SeedBase
  name: packet of cucumber seeds
  description: Can you grow water?
  id: CucumberSeeds
  components:
    - type: Seed
      seedId: cucumber
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/cucumber.rsi

- type: entity
  parent: SeedBase
  name: jar of bees
  description: Starter kit for a new apiarist.
  id: BeeSeeds
  components:
    - type: Seed
      seedId: bees
    - type: StaticPrice
      price: 50
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/bees.rsi
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Glass
    # "it's a jar of bees, it should break into bees"
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 3
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: GlassBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            MobAngryBee: # MobAngryBeeTimed doesn't exist in this fork; fall back to MobAngryBee
              min: 1
              max: 1
          transferForensics: true
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: DamageOnLand
      ignoreResistances: true
      damage:
        types:
          Blunt: 3
    - type: DamageOtherOnHit
      damage:
        types:
          Blunt: 3

