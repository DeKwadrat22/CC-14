# Seed packets for goob-ported plants. BlueTomatoSeeds already exists in
# upstream target so only the two missing packets are added here.

- type: entity
  parent: SeedBase
  name: packet of strange berry seeds
  id: StrangeBerrySeeds
  components:
    - type: Seed
      seedId: strangeBerries
    - type: Sprite
      sprite: _Goobstation/Objects/Specific/Hydroponics/strange_berries.rsi

- type: entity
  parent: SeedBase
  name: packet of mango seeds
  id: MangoSeeds
  components:
    - type: Seed
      seedId: mango
    - type: Sprite
      sprite: _RMC14/Objects/Kitchen/Plants/mango.rsi
