- type: entity
  parent: BaseDogborgKit
  id: DogborgKitK9
  name: K9 dogborg conversion kit
  description: Installs a K9-pattern canine security frame onto a cyborg endoskeleton.
  suffix: K9
  components:
  - type: Tag
