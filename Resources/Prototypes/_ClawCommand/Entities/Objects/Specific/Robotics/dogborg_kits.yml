# Dogborg conversion kits. Each kit is a small circuit-board / module item
# that's printed at the Exosuit Fabricator and inserted during cyborg
# construction to make the result a specific dogborg variant rather than a
# regular cyborg shell. The cyborg construction graph branches on the kit's
# Tag — see Resources/Prototypes/Recipes/Construction/Graphs/machines/cyborg.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseDogborgKit
  name: dogborg conversion kit
  description: A specialized circuit board that, when installed during cyborg construction, configures the resulting chassis as a quadrupedal "dogborg" variant.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: mainboard
  - type: Item
    size: Small
  - type: StaticPrice
    price: 80

