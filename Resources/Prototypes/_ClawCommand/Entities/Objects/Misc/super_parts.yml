# Tier-3 ("Super") stock part entities to give the SuperParts research a functional unlock.
# NOTE: The fork's machine system does not currently use per-tier stock parts (machines use
# MachineBoard + materials only), so these items exist as inert craftables. They can still
# be used as cargo, stack fuel for crafting, or future-proofing if part tiers are added.

- type: entity
  id: PicoManipulatorStockPart
  name: pico-manipulator
  parent: BaseStockPart
  description: A high-precision pico-scale manipulator. Vastly more capable than the standard modular machine part.
  suffix: Rating 3
  components:
  - type: Sprite
    state: pico_mani
  - type: Stack
    stackType: Manipulator
    count: 1

- type: entity
  id: SuperCapacitorStockPart
  name: super capacitor
  parent: BaseStockPart
  description: A super-tier capacitor packing absurd energy storage into a tiny package.
  suffix: Rating 3
  components:
  - type: Sprite
    state: super_capacitor
  - type: Stack
    stackType: Capacitor
    count: 1

- type: entity
  id: SuperMatterBinStockPart
  name: super matter bin
  parent: BaseStockPart
  description: A super-tier matter bin capable of storing reagents at extreme density.
  suffix: Rating 3
  components:
  - type: Sprite
    state: super_matter_bin
  - type: Stack
    stackType: MatterBin
    count: 1
