    state: icon

- type: entity
  parent: DrinkFitnessShakerBlack
  id: DrinkFitnessShakerBlue
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shakerblue.rsi
    state: icon

- type: entity
  parent: DrinkGlass
  id: DrinkIrishCarBomb
  suffix: irish car bomb
