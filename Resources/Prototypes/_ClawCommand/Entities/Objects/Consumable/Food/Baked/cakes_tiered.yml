# Tiered cakes
# Construction graph CakeTiered defined in _ClawCommand/Recipes/Construction/Graphs/food/cake_tiered.yml.
# Upgrade chain: FoodCakePlain --Frosting--> Single --CakeBase--> DoubleUnfrosted --Frosting--> Double --CakeBase--> TripleUnfrosted --Frosting--> Triple

- type: entity
  name: incomplete cake
  parent: FoodCakeBase
  id: FoodCakeTieredBase
  abstract: true
  description: A frosted cake. Too large to eat in without slicing.
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,2,2
  - type: Sprite
    sprite: _Floof/Objects/Consumable/Food/Baked/cake_tiered.rsi
  - type: Edible
    requiresSpecialDigestion: true # Prevent eating huge cakes without slicing them.

- type: entity
  parent: FoodCakeTieredBase
  id: FoodCakeTieredSingle
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Sprite
    state: single
  - type: Construction
    graph: CakeTiered
    node: singleFrosted

- type: entity
  parent: FoodCakeTieredBase
  id: FoodCakeTieredDoubleUnfrosted
  components:
  - type: Sprite
    state: double-unfrosted
  - type: Construction
    graph: CakeTiered
    node: doubleUnfrosted

- type: entity
  parent: [ FoodCakeTieredBase, BaseSlicingRefinableFood ]
  id: FoodCakeTieredDouble
  name: celebration cake
  description: A huge cake for special occasions. Too large to eat without slicing.
  components:
  - type: Sprite
    state: double
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 130
        reagents:
        - ReagentId: Nutriment
          Quantity: 72
        - ReagentId: Sugar
          Quantity: 36
        - ReagentId: Vitamin
          Quantity: 12
  - type: ToolRefinable
    refineResult:
    - id: FoodCakeTieredSlice
      amount: 12
  - type: Construction
    graph: CakeTiered
    node: doubleFrosted

- type: entity
  parent: FoodCakeTieredBase
  id: FoodCakeTieredTripleUnfrosted
  components:
  - type: Sprite
    state: triple-unfrosted
  - type: Construction
    graph: CakeTiered
    node: tripleUnfrosted

- type: entity
  parent: [ FoodCakeTieredBase, BaseSlicingRefinableFood ]
  id: FoodCakeTieredTriple
  name: wedding cake
  description: A gargantuan decorated cake for weddings. Too large to eat without slicing.
  components:
  - type: Sprite
    state: triple
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 200
        reagents:
        - ReagentId: Nutriment
          Quantity: 108
        - ReagentId: Sugar
          Quantity: 54
        - ReagentId: Vitamin
          Quantity: 18
  - type: ToolRefinable
    refineResult:
    - id: FoodCakeTieredSlice
      amount: 18
  - type: Construction
    graph: CakeTiered
    node: tripleFrosted

- type: entity
  name: slice of cake
  parent: FoodCakeSliceBase
  id: FoodCakeTieredSlice
  components:
  - type: Sprite
    sprite: _Floof/Objects/Consumable/Food/Baked/cake_tiered.rsi
    state: slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Sugar
          Quantity: 3
        - ReagentId: Vitamin
          Quantity: 1
