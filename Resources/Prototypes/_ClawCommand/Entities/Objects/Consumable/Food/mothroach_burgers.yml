# Claw Command — mothroach burger family ported from Goob-Station
# (Entities/Objects/Consumable/Food/burger.yml).
# Sprites copied to _ClawCommand/Objects/Consumable/Food/{mothroach_burger,chud_burger}.rsi.

# "Nothing burger" — for when nothing happens. Uses the Nothing reagent.
- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerChud
  name: chud burger
  description: A burger for when nothing happens.
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - nothing
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/chud_burger.rsi
    state: icon
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 6
        - ReagentId: Nothing
          Quantity: 5
  - type: Tag
    tags:
    - Meat

# Mustard mothroach burger — the base from which the other moth variants inherit.
- type: entity
  parent: FoodBurgerBase
  name: mothroachburger
  description: The last lamp it saw was the one inside the microwave.
  id: FoodBurgerMustard
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
      - light
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/mothroach_burger.rsi
    state: mustard_mothroach
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 7
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: FoodBurgerMustard
  id: FoodBurgerleopard
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/mothroach_burger.rsi
    state: leopard_mothroach

- type: entity
  parent: FoodBurgerMustard
  id: FoodBurgerlunar
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/mothroach_burger.rsi
    state: lunar_mothroach

- type: entity
  parent: FoodBurgerMustard
  id: FoodBurgerCecropia
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/mothroach_burger.rsi
    state: cecropia_mothroach
