# Snacks / Meals

- type: entity
  name: squeaking stir fry
  parent: FoodMealBase
  id: FoodMothSqueakingFry
  description: A mothic classic made with cheese curds and tofu (amongst other things).
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - tofu
      - leafy
  - type: Edible
    trash:
    - FoodPlateSmall
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Snacks/moth.rsi
    state: squeakingstirfry
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 6
        - ReagentId: Protein
          Quantity: 8
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like cheese, tofu and veggies

# Meals (lasagne)

- type: entity
  name: green lasagne
  parent: FoodMealBase
  id: FoodMothGreenLasagne
  description: A fine lasagne made with pesto and a herby white sauce. Good for multiple servings.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - pasta
  - type: SliceableFood
    count: 6
    slice: FoodMothGreenLasagneSlice
  - type: Edible
    trash:
    - FoodPlate
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/meal.rsi
    state: greenlasagne
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 18
        - ReagentId: Protein
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 6
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like cheese, pesto and pasta

# Baked / misc

- type: entity
  name: cheesecake balls
  parent: FoodBakedBase
