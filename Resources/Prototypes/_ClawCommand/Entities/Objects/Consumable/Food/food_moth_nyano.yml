# Cheese / Salad Base (ingredients)

- type: entity
  name: herby cheese
  parent: FoodBakingBase
  id: FoodMothHerbyCheese
  description: As a staple of mothic cuisine, cheese is often augmented with various flavours to keep variety in their diet.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - leafy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/ingredients.rsi
    state: herbycheese
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Protein
          Quantity: 2
        - ReagentId: Cream
          Quantity: 1
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like cheese, herbs

