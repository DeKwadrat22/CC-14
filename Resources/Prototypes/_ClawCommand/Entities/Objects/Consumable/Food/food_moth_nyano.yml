# Mothic salads, cheese, baked goods, and meals
# Reagent prototypes are not ported — entities still function as items.

# Salads

- type: entity
  name: caprese salad
  parent: FoodBakingBase
  id: FoodMothCapreseSalad
  description: A very tasty yet simple to prepare salad.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - tomato
      - leafy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/salad.rsi
    state: capresesalad
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Protein
          Quantity: 3
  - type: Tag
    tags:
    - Fruit
#Tastes like mozzarella, tomato and balsamic

- type: entity
  name: fleet salad
  parent: FoodBowlBase
  id: FoodMothFleetSalad
  description: The grilled cheese makes it particularly filling, while the croutons provide a crunchy kick.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - leafy
      - bread
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/salad.rsi
    state: fleetsalad
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 12
        - ReagentId: Vitamin
          Quantity: 5
        - ReagentId: Protein
          Quantity: 3
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like cheese, salad and bread

