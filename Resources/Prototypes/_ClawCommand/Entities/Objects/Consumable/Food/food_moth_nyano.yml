- type: entity
  name: moffin
  parent: FoodBakedBase
  id: FoodMothMoffin
  description: A delicious, spongy and dusty little cake.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/misc.rsi
    layers:
      - state: moffin
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          moffin: ""
      - enum.DamageStateVisualLayers.Base:
          moffin2: ""
      - enum.DamageStateVisualLayers.Base:
          moffin3: ""
  - type: FlavorProfile
    flavors:
      - muffin
      - cotton
      - fiber
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 1
        - ReagentId: Fiber
          Quantity: 4
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like muffin, dust and lint
