# Produce entities ported from Goob-Station (_Goobstation + _RMC14).
# Adaptations for this fork:
#   - FoodBluespaceTomato: SwapTeleportOnThrow component dropped (Goob-only,
#     not in this codebase). Tomato now behaves visually like a normal blue
#     tomato — no teleport-on-throw mechanic until that component is ported.

- type: entity
  name: strange berries
  parent: FoodProduceBase
  id: FoodStrangeBerries
  description: A handful of strange berries.
  components:
  - type: FlavorProfile
    flavors:
      - metallic
      - berry
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 11
        reagents:
        - ReagentId: Artifexium
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 4
  - type: Sprite
    sprite: _GoobStation/Objects/Specific/Hydroponics/strange_berries.rsi
  - type: Produce
    plantId: StrangeBerryPlants
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Artifexium
        Quantity: 5

- type: entity
  name: nevcotta log
  description: When planted out of its native habitat, it grows into an entirely different plant.
  id: Nevcotta
  parent: [ ProduceBase, BaseSlicingRefinable ]
  components:
  - type: Sprite
    sprite: _GoobStation/Objects/Specific/Hydroponics/nevcotta.rsi
    state: icon
  - type: SolutionContainerManager
  - type: Produce
    plantId: TowercapPlants
  - type: ToolRefinable
    refineResult:
    - id: NevcottaBark
      amount: 2

- type: entity
  name: nevcotta bark
  description: The bark of a Nevcotta tree.
  id: NevcottaBark
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _GoobStation/Objects/Specific/Hydroponics/nevcotta.rsi
    state: bark
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: NevcottaPowder
          Quantity: 5
        - ReagentId: Fiber
          Quantity: 4

- type: entity
  name: bluespace tomato
  parent: FoodBlueTomato
  id: FoodBluespaceTomato
  description: Be careful with it.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Singulo
          Quantity: 5
        canReact: false
  - type: Sprite
    sprite: _GoobStation/Objects/Specific/Hydroponics/bluespace_tomato.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    plantId: BlueTomatoPlants
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Singulo
        Quantity: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpillBehavior
        solution: food
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - Fruit
    - Vegetable

- type: entity
  name: mango
  parent: FoodProduceBase
  id: FoodMango
  description: "MANGO MANGO MANGO"
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - fruity
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 9
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 5
  - type: Sprite
    sprite: _RMC14/Objects/Kitchen/Plants/mango.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    plantId: MangoPlants
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceMango
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
  - type: FoodSequenceElement
    entries:
      Taco: FSE_Mango
      Burger: FSE_MangoBurger
