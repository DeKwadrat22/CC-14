# Ghost-role spawn points for the dogborg cyborg variants.
#
# Each spawn point is mapper-placeable (and admin spawn-able from the entity menu).
# When a player claims the role from the ghost role menu, they spawn as the
# corresponding `BorgChassisXxxYyy` entity defined in
# Resources/Prototypes/_ClawCommand/Entities/Mobs/Cyborgs/dogborg_chassis.yml.
#
# Sprites: Citadel-Station-13 (CC-BY-SA-3.0). See the LICENSE.md next to the
# dogborg RSIs for full attribution.

# Shared base. Hides itself from the spawn menu — concrete variants below appear
# in the spawn menu instead.
- type: entity
  abstract: true
  categories: [ HideSpawnMenu ]
  parent: MarkerBase
  id: BaseSpawnPointGhostDogborg
  name: ghost role spawn point
  suffix: dogborg
  components:
  - type: GhostRole
    rules: ghost-role-information-silicon-rules
    mindRoles:
    - MindRoleSiliconBrain # same as other station cyborgs
    raffle:
      settings: default
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green

