# Claw Command - Silicon Humanoid Base Entity
# Ported from space folder

- type: entity
  save: false
  id: PlayerSiliconHumanoidBase
  parent: [BaseMob, MobDamageable, MobCombat, MobAtmosExposed, MobFlammable]
  abstract: true
  components:
    - type: CanEnterCryostorage
    - type: ContentEye
    - type: CameraRecoil
    - type: Reactive
      groups:
        Flammable: [Touch]
        Extinguish: [Touch]
        Acidic: [Touch]
      reactions:
        - reagents: [Water, SpaceCleaner]
          methods: [Touch]
          effects:
            - !type:WashCreamPie
    - type: DamageOnHighSpeedImpact
      damage:
        types:
          Blunt: 10
      soundHit:
        path: /Audio/Effects/hit_kick.ogg
    - type: Damageable
      damageModifierSet: IPC
    # Fork's WeldingHealableSystem gates on Injurable.DamageContainer (upstream split it off Damageable).
    # Without this override, MobIPC inherits Biological from MobDamageable and welder-heal silently no-ops.
    - type: Injurable
      damageContainer: Silicon
    - type: InteractionOutline
    - type: MovementSpeedModifier
      baseWalkSpeed: 4
      baseSprintSpeed: 3
    - type: ZombieImmune
    - type: DoAfter
    - type: RotationVisuals
      horizontalRotation: 90
    - type: Examiner
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.35
          density: 185
          restitution: 0.0
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: Silicon
      entityType: enum.SiliconType.Player
      batteryPowered: false
      chargeThresholdMid: 0.60
      chargeThresholdLow: 0.30
      chargeThresholdCritical: 0
      speedModifierThresholds:
        4: 1
        3: 1
        2: 0.80
        1: 0.45
        0: 0.00
    - type: Temperature
      currentTemperature: 310.15
      specificHeat: 42
      atmosTemperatureTransferEfficiency: 0.05
    - type: TemperatureDamage
      heatDamageThreshold: 1800
      coldDamageThreshold: 260
      coldDamage:
        types:
          Cold: 0.1 # per second, scales with temperature & other constants
      heatDamage:
        types:
          Heat: 0.5 # per second, scales with temperature & other constants
    - type: Deathgasp
      prototype: SiliconDeathgasp
    - type: MobState
      allowedStates:
        - Alive
        - Dead
    - type: MobThresholds
      thresholds:
        0: Alive
        165: Dead
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 500
          behaviors:
            - !type:GibBehavior { }
    - type: Icon
      sprite: Mobs/Species/IPC/parts.rsi
      state: full
    - type: Sprite
      noRot: true
      drawdepth: Mobs
      layers:
        - map: ["enum.HumanoidVisualLayers.Tail"]
        - map: ["enum.HumanoidVisualLayers.Chest"]
        - map: ["enum.HumanoidVisualLayers.Head"]
        - map: ["enum.HumanoidVisualLayers.Snout"]
        - map: ["enum.HumanoidVisualLayers.Eyes"]
        - map: ["enum.HumanoidVisualLayers.RArm"]
        - map: ["enum.HumanoidVisualLayers.LArm"]
        - map: ["enum.HumanoidVisualLayers.RLeg"]
        - map: ["enum.HumanoidVisualLayers.LLeg"]
        - shader: StencilClear
          sprite: Mobs/Species/Human/parts.rsi
          state: l_leg
        - shader: StencilMask
          map: ["enum.HumanoidVisualLayers.StencilMask"]
          sprite: Mobs/Customization/masking_helpers.rsi
          state: female_full
          visible: false
        - map: ["enum.HumanoidVisualLayers.LFoot"]
        - map: ["enum.HumanoidVisualLayers.RFoot"]
        - map: ["jumpsuit"]
        - map: ["enum.HumanoidVisualLayers.LHand"]
        - map: ["enum.HumanoidVisualLayers.RHand"]
        - map: ["enum.HumanoidVisualLayers.Handcuffs"]
          color: "#ffffff"
          sprite: Objects/Misc/handcuffs.rsi
          state: body-overlay-2
          visible: false
        - map: ["id"]
        - map: ["gloves"]
        - map: ["shoes"]
        - map: ["ears"]
        - map: ["outerClothing"]
        - map: ["eyes"]
        - map: ["belt"]
        - map: ["neck"]
        - map: ["back"]
        - map: ["enum.HumanoidVisualLayers.FacialHair"]
        - map: ["enum.HumanoidVisualLayers.Hair"]
        - map: ["enum.HumanoidVisualLayers.HeadSide"]
        - map: ["enum.HumanoidVisualLayers.HeadTop"]
        - map: ["mask"]
        - map: ["head"]
        - map: ["pocket1"]
        - map: ["pocket2"]
    - type: Flammable
      fireSpread: true
      canResistFire: true
      damage:
        types:
          Heat: 0
    - type: Identity
    - type: RangedDamageSound
      soundGroups:
        Brute:
          collection: MetalBulletImpact
      soundTypes:
        Heat:
          collection: MetalLaserImpact
    - type: Tag
      tags:
        - CanPilot
        - FootstepSound
        - DoorBumpOpener
    - type: Hands
    - type: Inventory
      templateId: human
    - type: InventorySlots
    - type: Appearance
    - type: Cuffable
    - type: AnimationPlayer
    - type: Buckle
    - type: CreamPied
      sprite:
        sprite: Effects/creampie.rsi
        state: creampie_human
    - type: Stripping
    - type: Strippable
    - type: ComplexInteraction
    - type: UserInterface
      interfaces:
        enum.HumanoidMarkingModifierKey.Key:
          type: HumanoidMarkingModifierBoundUserInterface
        enum.StrippingUiKey.Key:
          type: StrippableBoundUserInterface
        enum.InstrumentUiKey.Key:
          type: InstrumentBoundUserInterface
          requireInputValidation: false
    - type: Emoting
    - type: Grammar
      attributes:
        proper: true
    - type: Climbing
    - type: StandingState
    - type: MindExaminable
    - type: SSDIndicator
    - type: CanEscapeInventory
    - type: HumanoidProfile
      species: IPC
    - type: Body
      requiredLegs: 2
      thermalVisibility: false
    - type: InitialBody
      organs:
        Torso: OrganIPCTorso
        Head: OrganIPCHead
        ArmLeft: OrganIPCArmLeft
        ArmRight: OrganIPCArmRight
        HandRight: OrganIPCHandRight
        HandLeft: OrganIPCHandLeft
        LegLeft: OrganIPCLegLeft
        LegRight: OrganIPCLegRight
        FootLeft: OrganIPCFootLeft
        FootRight: OrganIPCFootRight
        Brain: OrganIPCBrain
        Eyes: OrganIPCEyes
    - type: Ensnareable
      sprite: Objects/Misc/ensnare.rsi
    - type: Speech
      speechSounds: Pai
    - type: Vocal
      wilhelm: "/Audio/Voice/IPC/wilhelm.ogg"
      emoteSounds: UnisexIPC # Claw Command - was a sex-keyed 'sounds' dict, removed by the WizDen rebase
    - type: MeleeWeapon
      hidden: true
      soundHit:
        collection: Punch
      angle: 30
      animation: WeaponArcFist
      attackRate: 1
      damage:
        types:
          Blunt: 6
#     TODO - These need to be reimplemented eventually.
#     heavyDamageBaseModifier: 1
#     heavyPartDamageMultiplier: 1
#     heavyStaminaCost: 0
      maxTargets: 1
    - type: MobPrice
      price: 1500
      deathPenalty: 0.01
    - type: Pullable
    - type: Puller
    - type: BodyEmotes
      soundsId: GeneralBodyEmotes
    - type: DamageVisuals
      thresholds: [ 10, 20, 30, 50, 70, 100 ]
      targetLayers:
        - "enum.HumanoidVisualLayers.Chest"
        - "enum.HumanoidVisualLayers.Head"
        - "enum.HumanoidVisualLayers.LArm"
        - "enum.HumanoidVisualLayers.LLeg"
        - "enum.HumanoidVisualLayers.RArm"
        - "enum.HumanoidVisualLayers.RLeg"
      damageOverlayGroups:
        Brute:
          sprite: Mobs/Effects/brute_damage.rsi
          color: "#DD8822"
    - type: IdExaminable
    - type: HealthExaminable
      examinableTypes:
        - Blunt
        - Slash
        - Piercing
        - Heat
        - Shock
    - type: StatusEffects
      allowed:
        - Stun
        - KnockedDown
        - SlowedDown
        - Stutter
        - SeeingRainbows
        - Electrocution
        - Flashed
        - SlurredSpeech
        - PressureImmunity
        - Muted
        - TemporaryBlindness
        - Pacified
    - type: Blindable
    - type: FireVisuals
      alternateState: Standing
    - type: LightningTarget
      priority: 1
      lightningExplode: false

- type: damageModifierSet
  id: IPC
  coefficients:
    Poison: 0
    Cold: 0.2
    Heat: 2
    Shock: 2.5
