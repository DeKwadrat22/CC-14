# _ClawCommand: Avali body markings.
# Ear sprites originate from space/Resources/Textures/_ADT/Mobs/Customization/Reptilian/reptilian_ears.rsi
# (avali_inner / avali_outer states), copied into our own avali_ears.rsi so the asset isn't bound
# to the unrelated reptilian marking namespace.
# Tail/feather/fluff markings ported from space/Resources/Textures/_Floof/Mobs/Customization/resomi_parts.rsi
# (Avali is a Resomi-derived species in space lore), rebranded into _ClawCommand/Mobs/Customization/avali_marks.rsi.

# Ears (inner + outer, two-layer colour like CatEars)
- type: marking
  id: AvaliEars
  bodyPart: HeadTop
  groupWhitelist: [ MarkingsAvali ]
  coloring:
    layers:
      avali_outer:
        type:
          !type:CategoryColoring
          category: Hair
        fallbackTypes:
        - !type:CategoryColoring
          category: FacialHair
        - !type:SkinColoring
      avali_inner:
        type:
          !type:SimpleColoring
          color: "#FFFFFF"
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_ears.rsi
    state: avali_outer
  - sprite: _ClawCommand/Mobs/Customization/avali_ears.rsi
    state: avali_inner

# Tail (base shape — forced to skin tone so the silhouette reads as part of the body)
- type: marking
  id: AvaliTail
  bodyPart: Chest
  groupWhitelist: [ MarkingsAvali ]
  forcedColoring: true
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: tail

# Tail feathers (the colourful plumage layer on top of the tail shape)
- type: marking
  id: AvaliTailFeathers
  bodyPart: Chest
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: tail_feathers

# Arm/leg feather tufts (one per limb, mapped to the corresponding LeftHand/RightHand/LeftFoot/RightFoot layers)
- type: marking
  id: AvaliLArmFeathers
  bodyPart: LHand
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: l_hand_feathers

- type: marking
  id: AvaliRArmFeathers
  bodyPart: RHand
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: r_hand_feathers

- type: marking
  id: AvaliLLegFeathers
  bodyPart: LFoot
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: l_foot_feathers

- type: marking
  id: AvaliRLegFeathers
  bodyPart: RFoot
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: r_foot_feathers

# Chest fluff (optional)
- type: marking
  id: AvaliFluff
  bodyPart: Chest
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: fluff

# Head fluff (two flavours: flat and standing up)
- type: marking
  id: AvaliFluffHead
  bodyPart: Head
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: fluff_head

- type: marking
  id: AvaliFluffHeadUp
  bodyPart: Head
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/avali_marks.rsi
    state: fluff_head_up
