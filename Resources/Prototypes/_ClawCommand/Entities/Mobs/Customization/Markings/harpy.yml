# All the Harpy customization

# Ears Markings
- type: marking
  id: HarpyWingDefaultHuescale
  bodyPart: Tail
# groupWhitelist: [Harpy, Human] # CC: No Harpy yet.
  groupWhitelist: [Human]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:SimpleColoring
          color: "#964b00"
  sprites:
    - sprite: _ClawCommand/Mobs/Customization/Harpy/harpy_wings.rsi
      state: huescale_harpy

