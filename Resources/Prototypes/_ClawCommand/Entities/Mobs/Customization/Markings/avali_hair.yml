# _ClawCommand: Avali-flavored hair markings.
# Wires up the orphan resomi_hair.rsi states (18 hairstyles) into the marking system as
# Avali-only options. These show up alongside the vanilla human hair pool which Avali
# already access — gives the species a small flavour-bank of bird-style "hair".

- type: marking
  id: AvaliHairBackstrafe
  bodyPart: Hair
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/resomi_hair.rsi
    state: ResomiBackstrafe

