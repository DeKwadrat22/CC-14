# Moth-specific

- type: marking
  id: MakeupMothLips
  bodyPart: Head   # The marking category is in Overlay instead of Head
                             # because the Head category for moths only allows 1
                             # marking and lips should be usable alongside blush
  groupWhitelist: [Moth]
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#7e2727"
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/makeup.rsi
    state: moth_lips

- type: marking
  id: MakeupMothBlush
  bodyPart: Head
  groupWhitelist: [Moth]
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#d39394"
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/makeup.rsi
    state: moth_blush
