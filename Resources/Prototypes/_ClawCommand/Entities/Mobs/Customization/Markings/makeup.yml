- type: marking
  id: MakeupLips
  bodyPart: Head
  groupWhitelist: [Human, Slime, MarkingsFelinid, MarkingsTajaran, MarkingsKitsune] # Delta V - MarkingsFelinid, MarkingsTajaran, Harpy
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#7e2727"
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/makeup.rsi
    state: lips

- type: marking
  id: MakeupBlush
  bodyPart: Head
  groupWhitelist: [Human, Reptilian, Slime, MarkingsFelinid, MarkingsTajaran, Vulpkanin, MarkingsKitsune] # Delta V - MarkingsFelinid, MarkingsTajaran, Vulpkanin, Harpy
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#d39394"
  sprites:
