# Claw Command - Shadekin markings ported from Floofstation/ADT
# Ears

- type: marking
  id: EarsShadowkin
  bodyPart: HeadTop
  groupWhitelist: [MarkingsShadowkin]
  forcedColoring: true
  sprites:
    - sprite: _ClawCommand/Mobs/Customization/Shadowkin/ears.rsi
      state: shadowkin

- type: marking
  id: EarsShadowkinStriped
  bodyPart: HeadTop
  groupWhitelist: [MarkingsShadowkin]
  coloring:
    default:
      type:
        !type:SkinColoring
    layers:
      shadowkin_stripes:
        type:
          !type:SimpleColoring
            color: "#FFFFFF"
  sprites:
    - sprite: _ClawCommand/Mobs/Customization/Shadowkin/ears.rsi
      state: shadowkin
    - sprite: _ClawCommand/Mobs/Customization/Shadowkin/ears.rsi
      state: shadowkin_stripes

