    - ActionDogborgBellyUp
  - type: BorgSwitchableType
    selectedBorgType: dogborg-k9

- type: entity
  parent: BorgChassisSecurityK9
  id: BorgChassisSecurityK9Dark
  name: K9 dark cyborg
  suffix: K9 Dark
  components:
  # K9 Dark doesn't ship separate _e/_l states in the source DMI, so the Light/
  # LightStatus layers reuse the base k9dark state. They're invisible by default
  # â€” the borg-type system needs the layer keys to exist regardless, so it can
  # toggle visibility for mind / light status without throwing.
  - type: Sprite
    sprite: _ClawCommand/Mobs/Silicon/dogborg_k9dark.rsi
    layers:
    - state: k9dark
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: k9dark
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: k9dark
      map: ["light", "enum.BorgVisualLayers.LightStatus"]
      shader: unshaded
      visible: false
  - type: BorgChassis
    hasMindState: k9dark
    noMindState: k9dark
  - type: BorgBakedBody
  # _ClawCommand: SpriteMovement here is a marker for BorgSystem.GetMotionState.
  # MovementLayers/NoMovementLayers are left empty on purpose — layer state
  # swaps are driven by BorgSwitchableTypeSystem + BorgSystem so the body,
  # eye-glow and light-strip layers all flip in lockstep.
  - type: SpriteMovement
  # _ClawCommand: pose state + action buttons for the sit / rest / belly-up
  # poses. The matching emote prototypes (DogborgSit/Rest/BellyUp) and the
  # action events all funnel into DogborgPoseSystem.
  - type: DogborgPose
  - type: ActionGrant
    actions:
    - ActionDogborgSit
    - ActionDogborgRest
    - ActionDogborgBellyUp
  - type: BorgSwitchableType
    selectedBorgType: dogborg-k9-dark

