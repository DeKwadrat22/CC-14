# Dogborg cyborg variants. These are children of the regular BorgChassis*
# entities â€” same behavior, modules, and stats; only the sprite RSI differs.
# Sprite work originates from Citadel-Station-13 (see
# Resources/Textures/_ClawCommand/Mobs/Silicon/LICENSE.md).

# Common visual setup macro: each dogborg uses the same three-layer scheme
# as upstream BorgChassisSelectable â€” base body / eyes / lights â€” but
# remapped to per-variant state names from the ported RSI.

# ===== Medical: Medihound =====
- type: entity
  parent: BorgChassisMedical
  id: BorgChassisMedicalMedihound
  name: medihound cyborg
  description: A canine-shaped medical cyborg, a relic of an older station design.
  suffix: Medihound
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Silicon/dogborg_medihound.rsi
    layers:
    - state: medihound
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: medihound_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: medihound_l
      shader: unshaded
      map: ["light", "enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: BorgChassis
    hasMindState: medihound_e
    noMindState: medihound
  - type: BorgBakedBody
  # _ClawCommand: SpriteMovement here is a marker for BorgSystem.GetMotionState.
  # MovementLayers/NoMovementLayers are left empty on purpose — layer state
  # swaps are driven by BorgSwitchableTypeSystem + BorgSystem so the body,
  # eye-glow and light-strip layers all flip in lockstep.
  - type: SpriteMovement
  # _ClawCommand: pose state + action buttons for the sit / rest / belly-up
  # poses. The matching emote prototypes (DogborgSit/Rest/BellyUp) and the
  # action events all funnel into DogborgPoseSystem.
  - type: DogborgPose
  - type: ActionGrant
    actions:
    - ActionDogborgSit
    - ActionDogborgRest
    - ActionDogborgBellyUp
  - type: BorgSwitchableType
    selectedBorgType: dogborg-medihound

