# Salt water variants
- type: entity
  parent: FloorWaterDeep
  id: FloorWaterSaltDeep
  name: deep salt water
  description: Deep ocean water with a faint taste of salt. The depths below are dark and vast.
  components:
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999
        reagents:
        - ReagentId: Water
          Quantity: 9999999

- type: entity
  parent: FloorWaterMedium
  id: FloorWaterSaltMedium
  name: salt water
  description: Clear salt water lapping gently. You can taste the ocean breeze.
  components:
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999
        reagents:
        - ReagentId: Water
          Quantity: 9999999

- type: entity
  parent: FloorWaterShallow
  id: FloorWaterSaltShallow
  name: shallow salt water
  description: Warm, shallow salt water washing over your feet. Tiny waves catch the light.
  components:
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999
        reagents:
        - ReagentId: Water
          Quantity: 9999999
