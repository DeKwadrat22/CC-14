- type: entity
  parent: FloorWaterEntity
  id: FloorWaterDeep
  name: deep water
  description: Crystal clear deep water. The bottom is barely visible beneath the shimmering surface.
  components:
  - type: Sprite
    sprite: _ClawCommand/Tiles/Water.rsi
    drawdepth: BelowFloor
    layers:
      - state: water_deep
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.2
    sprintSpeedModifier: 0.2

- type: entity
  parent: FloorWaterEntity
  id: FloorWaterMedium
  name: water
  description: Cool, refreshing water that reaches up to your waist. A gentle current flows through it.
  components:
  - type: Sprite
    sprite: _ClawCommand/Tiles/Water.rsi
    drawdepth: BelowFloor
    layers:
      - state: water_medium
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.4
    sprintSpeedModifier: 0.4

- type: entity
  parent: FloorWaterEntity
  id: FloorWaterShallow
  name: shallow water
  description: Pristine shallow water, gently lapping at your ankles. You can see the bottom clearly.
  components:
  - type: Sprite
    sprite: _ClawCommand/Tiles/Water.rsi
    drawdepth: BelowFloor
    layers:
      - state: water_shallow
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.6
    sprintSpeedModifier: 0.6

