# Claw Command - Smaller probabilistic vent critter spawns (per-vent prob roll
# instead of the bulk horde already in /GameRules/events.yml).
# Ported from Floof/DeltaV.

- type: entity
  id: SlimesSpawn
  parent: BaseStationEventShortDelay
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    startAnnouncement: station-event-slimes-spawn-announcement
    earliestStart: 20
    minimumPlayers: 10
    weight: 5
    duration: 60
  - type: VentCrittersRule
    entries:
    - id: MobAdultSlimesBlueAngry
      prob: 0.02
    - id: MobAdultSlimesGreenAngry
      prob: 0.02
    - id: MobAdultSlimesYellowAngry
      prob: 0.02

- type: entity
  id: SpiderSpawn
  parent: BaseStationEventShortDelay
  categories: [ HideSpawnMenu ]
  components:
