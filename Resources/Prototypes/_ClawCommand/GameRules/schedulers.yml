# Claw Command - event schedulers for Secret and Extended Irregular.
#
# All of these ramp: the gap between events shrinks as the shift goes on. The gap is
#   random(minEventTime / chaos, maxEventTime / chaos)
# where chaos climbs linearly from `initialChaos` at round start to roughly `averageChaos`
# plus `initialChaos` at `averageEndTime` minutes in, then holds flat there for the rest of
# the round however long it runs. `averageEndTime` is only "when the ramp stops climbing" -
# it is not a round length, and overrunning it never calms the round back down.
#
# Two knobs shape a preset:
#   initialChaos vs averageChaos -> how steep the ramp is (how much worse hour two is)
#   minEventTime / maxEventTime  -> the pacing band the ramp is applied to
#
# Both modes share initialChaos per difficulty (0.55 / 0.75 / 0.9), so the two open at the
# same relative calm. The difference is the band: Extended Irregular applies the ramp to a
# wide, slow 10-25 min window, Secret to a tighter 7-16.7 min one. That keeps Secret shorter
# between events than Extended Irregular at every point of the shift without Secret's opening
# hour feeling frantic.
#
# Roughly, minutes between events at round start / 60 min in / plateau. The plateau is the
# permanent floor once the ramp tops out, so it is the number that decides how a long round
# feels - rounds here regularly run past averageEndTime.
#   Irregular Easy    18-45  /  9-23   /  6.1-15.2
#   Irregular Medium  13-33  /  7-17   /  4.4-11.1
#   Irregular Hard    11-28  /  5-13   /  3.4-8.6
#   Secret Easy       13-30  /  6.6-16 /  4.7-11.1
#   Secret Medium      9-22  /  4.6-11 /  3.3-7.9
#   Secret Hard        8-19  /  3.4-8  /  2.5-5.8

# ---------------------------------------------------------------------------
# Extended Irregular
# ---------------------------------------------------------------------------

- type: entity
  id: CCIrregularEasyScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: RampingStationEventScheduler
    minEventTime: 600
    maxEventTime: 1500
    initialChaos: 0.55
    averageChaos: 1.1
    averageEndTime: 120
    scheduledGameRules: !type:NestedSelector
      tableId: CCIrregularEasyEventsTable

- type: entity
  id: CCIrregularMediumScheduler
  parent: BaseGameRule
