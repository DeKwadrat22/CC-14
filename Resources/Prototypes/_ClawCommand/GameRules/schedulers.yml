# Claw Command - event schedulers for Secret and Extended Irregular.
#
# All of these ramp: the gap between events shrinks as the shift goes on. The gap is
#   random(minEventTime / chaos, maxEventTime / chaos)
# where chaos climbs linearly from `initialChaos` at round start to roughly `averageChaos`
# plus `initialChaos` at `averageEndTime` minutes in, then holds.
#
# Two knobs shape a preset:
#   initialChaos vs averageChaos -> how steep the ramp is (how much worse hour two is)
#   minEventTime / maxEventTime  -> the pacing band the ramp is applied to
#
# Extended Irregular uses a wide, slow band. Secret uses a tighter, faster one, so Secret
# is always shorter between events than Extended Irregular at the same point in the shift.
#
# Roughly, minutes between events at round start / 60 min in / 120 min in:
#   Irregular Easy    18-45  /  9-23  /  6-15
#   Irregular Medium  13-33  /  7-17  /  4-11
#   Irregular Hard    11-28  /  5-13  /  3-9
#   Secret Easy        6-16  /  3-8   /  2-6
#   Secret Medium      4-12  /  2-6   /  1.5-4
#   Secret Hard        3-8   /  1.5-4 /  1-3

# ---------------------------------------------------------------------------
# Extended Irregular
# ---------------------------------------------------------------------------

- type: entity
  id: CCIrregularEasyScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: RampingStationEventScheduler
    minEventTime: 600
    maxEventTime: 1500
    initialChaos: 0.55
    averageChaos: 1.1
    averageEndTime: 120
    scheduledGameRules: !type:NestedSelector
      tableId: CCIrregularEasyEventsTable

- type: entity
  id: CCIrregularMediumScheduler
