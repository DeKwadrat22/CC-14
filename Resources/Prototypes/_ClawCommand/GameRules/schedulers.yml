# ---------------------------------------------------------------------------
# Meteor schedulers
#
# Extended Irregular keeps roughly the old cadence and only fires when engineering is
# staffed (the crew requirement lives on CCIrregularMeteorSwarmTable). Secret is markedly
# more frequent, and gets more frequent again with difficulty.
# ---------------------------------------------------------------------------

- type: entity
  id: CCIrregularEasyMeteorScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1500
    maximumSpanUntilFirstEvent: 900
    minMaxEventTiming:
      min: 1800
      max: 7200
    scheduledGameRules: !type:NestedSelector
      tableId: CCIrregularMeteorSwarmTable

- type: entity
