# ---------------------------------------------------------------------------
# Meteors
#
# Secret gets them straight. Extended Irregular only gets them when engineering is
# actually staffed, because nobody else is repairing a hulled department.
# ---------------------------------------------------------------------------

- type: entityTable
  id: CCIrregularMeteorSwarmTable
  table: !type:NestedSelector
    tableId: BasicMeteorSwarmEventsTable
    conditions:
    - !type:DepartmentCrewCondition
      departments: [ Engineering ]
      min: 2

