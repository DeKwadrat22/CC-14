# Claw Command - event pools for the Secret and Extended Irregular schedulers.
#
# Events are grouped into small category tables here. The per-gamemode, per-difficulty
# tables further down pull those categories in with a `prob:`, which is the chance the
# whole category is even eligible on a given event roll. Once eligible, the individual
# event is picked from the combined pool by its own StationEvent `weight:`.
#
# So: `prob` = how often this KIND of thing happens in this gamemode.
#     `weight` (on the event itself) = which one of them you get. Do not edit weights
#     here to retune a gamemode, edit the probs.

# ---------------------------------------------------------------------------
# Categories
# ---------------------------------------------------------------------------

# Ambient station problems. The backbone of every round, always eligible.
- type: entityTable
  id: CCAmbientEventsTable
  table: !type:AllSelector
    children:
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: GasLeak
    - id: GreytideVirus
    - id: KudzuGrowth
    - id: MassHallucinations
    - id: MimicVendorRule # Claw Command - we restored this rule; see GameRules/events.yml
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SolarFlare
    - id: VentClog
    # Claw Command - NoosphericStorm lives here rather than with the other glimmer events because it
    # is the injector, not a symptom: it is the only one that ADDS glimmer (+65-85). CCGlimmerEventsTable
    # is fired by CCGlimmerScheduler, which needs 200 glimmer before it does anything, so if the storm
    # were only in there it could never fire on a station that had not already built glimmer some other
    # way, and a round with a quiet Epistemics would see no psionic content at all. Keeping it ambient
    # means the noosphere can always get going on its own; everything downstream is still glimmer-gated.
    - id: NoosphericStorm

# Split out so Extended Irregular can require a staffed science department.
- type: entityTable
  id: CCAnomalyEventsTable
  table: !type:AllSelector
    children:
    - id: AnomalySpawn

# "Psion storm". Split out so Extended Irregular can make it rarer, since a hostile
# lawset silicon is a whole antag's worth of round for a mode that isn't about that.
# Claw Command - noospheric / glimmer events.
#
# This table is NOT nested into the per-gamemode pools. It is owned by CCGlimmerScheduler, which rolls
# against the station's glimmer level rather than the ordinary event pacing: nothing under 200 glimmer,
# then 15% per half hour at 200 rising 5% per further 100 glimmer. See schedulers.yml.
#
# Two separate filters decide what you actually get:
#   CCGlimmerScheduler  -> WHETHER a glimmer event happens at all, from the current glimmer level.
#   minimumGlimmer / maximumGlimmer on each event (Psionics/events.yml) -> WHICH ones are eligible.
# So a roll at 220 can only surface the low end, while the same roll at 800 has the whole ladder open.
#
# NoosphericStorm appears both here and in CCAmbientEventsTable. It is the only event that raises glimmer,
# so it also has to be reachable below 200 or nothing could ever start - see the note over there.
- type: entityTable
  id: CCGlimmerEventsTable
  table: !type:AllSelector
    children:
    - id: NoosphericStorm
    - id: MundaneDischarge
    - id: NoosphericZap
    - id: NoosphericFry
    - id: PsionicCatGotYourTongue
    - id: GlimmerWispSpawn
    - id: GlimmerMiteSpawn
    - id: GlimmerRandomSentience
    - id: GlimmerRevenantSpawn
    - id: FreeProber

- type: entityTable
  id: CCIonStormEventsTable
  table: !type:AllSelector
    children:
    - id: IonStorm

# Harmless critters. Flavour, not a threat - always eligible in both modes.
- type: entityTable
  id: CCVerminEventsTable
  table: !type:AllSelector
    children:
    - id: CockroachMigration
    - id: MothroachSpawn
    - id: MouseMigration
    - id: RandomCritterHorde
    - id: SnailMigrationLowPop

# Hostile mob spawns - light. A nuisance, handled by any armed crewmember.
- type: entityTable
  id: CCHostileMobLightTable
  table: !type:AllSelector
    children:
    - id: ClosetSkeleton
    - id: SlimesSpawn
    - id: SpiderSpawn
    - id: SpiderClownSpawn
    - id: XenoVentsWeak

# Split out so Extended Irregular can gate it on a staffed Security department.
- type: entityTable
  id: CCClownSpiderTable
  table: !type:AllSelector
    children:
    - id: SpiderClownSpawn

# As CCHostileMobLightTable, but the clown spiders only show up if somebody in Security is
# alive to deal with them. Identical otherwise, so the weighting is unchanged when they are.
- type: entityTable
  id: CCIrregularHostileMobLightTable
  table: !type:AllSelector
    children:
    - id: ClosetSkeleton
    - id: SlimesSpawn
    - id: SpiderSpawn
    - id: XenoVentsWeak
    - !type:NestedSelector
      tableId: CCClownSpiderTable
      conditions:
      - !type:DepartmentCrewCondition
        departments: [ Security ]
        min: 1

# Hostile mob spawns - heavy. Needs an organised security response.
- type: entityTable
  id: CCHostileMobHeavyTable
  table: !type:AllSelector
    children:
    - id: KingRatMigration
    - id: RevenantSpawn
    - id: SlimesSpawnHorde
    - id: SnailMigration
    - id: SnakeSpawnHorde
    - id: SpiderSpawnHorde
    - id: SpiderClownSpawnHorde
    - id: XenoVents

# Hostile mob spawns - boss. Round-defining.
- type: entityTable
  id: CCHostileMobBossTable
  table: !type:AllSelector
    children:
    - id: DragonSpawn

# Syndicate infiltration. The house style for Extended Irregular: a person with an
# agenda, not a mob with a hitbox.
- type: entityTable
  id: CCSyndicateInfiltrationTable
  table: !type:AllSelector
    children:
    - id: NinjaSpawn
    - id: SyndieOutpostSpawn

# Sleeper agents, single wave.
- type: entityTable
  id: CCSleeperAgentsTable
  table: !type:AllSelector
    children:
    - id: CCSecretSleeperAgents

# Sleeper agents, repeatable. Each wave is a separate prototype because the rule runs for
# the whole round, and an active rule can never be re-picked by the scheduler.
#
# Two waves is the hard ceiling at any population - there is deliberately no third.
#
# The condition is what spaces them out: the second wave is only eligible once the first has been
# running for 60 minutes, and ReoccurrenceDelayCondition fails outright if that rule never ran, so
# the waves can only ever fire in order. This is relative to the first wave rather than an absolute
# earliestStart, so a shift that got its first wave late does not immediately owe you a second.
#
# Two knobs keep the second wave rare, and both are needed. The 60 minute gap means it usually
# cannot even come up before a normal length shift ends - with a first wave around 35 minutes it
# is not eligible until roughly 95. The extra prob: 0.2 then makes it a fifth as likely per roll
# as the first wave, so even the long shifts that do reach it mostly do not get it. Net effect on
# the hardest tier: ~1% of 100 minute rounds, ~18% of 130 minute ones. Shortening the delay is a
# far bigger lever than raising the prob, because it buys many more eligible rolls.
# See antag_variants.yml for why the weights are huge.
- type: entityTable
  id: CCSleeperAgentsRepeatTable
  table: !type:AllSelector
    children:
    - id: CCSecretSleeperAgents
    - id: SleeperAgentsSecondWave
      prob: 0.2
      conditions:
      - !type:ReoccurrenceDelayCondition
        ruleOverride: CCSecretSleeperAgents
        delay: 60m

# The same waves, but handing out Extended Irregular's "kill once" contracts instead of the
# round-removal ones. Secret keeps the table above.
- type: entityTable
  id: CCIrregularSleeperAgentsRepeatTable
  table: !type:AllSelector
    children:
    - id: CCIrregularSleeperAgents
    - id: CCIrregularSleeperAgentsSecondWave
      prob: 0.2
      conditions:
      - !type:ReoccurrenceDelayCondition
        ruleOverride: CCIrregularSleeperAgents
        delay: 60m

# Other single-target infiltrators.
- type: entityTable
  id: CCInfiltratorEventsTable
  table: !type:AllSelector
    children:
    - id: ParadoxCloneSpawn

# High-impact, low-roleplay antag events. Secret only.
- type: entityTable
  id: CCLrpAntagEventsTable
  table: !type:AllSelector
    children:
    - id: LoneOpsSpawn
    - id: WizardSpawn
    - id: ZombieOutbreak

# ---------------------------------------------------------------------------
# Extended Irregular pools
#
# Roleplay-first. Syndicate infiltration is the common threat, random mob spawns are
# rare (less rare on Hard), and heretic / lone op / zombie outbreak never appear.
# ---------------------------------------------------------------------------

- type: entityTable
  id: CCIrregularEasyEventsTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: CCAmbientEventsTable
    - !type:NestedSelector
      tableId: CCVerminEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector # needs scientists to actually contain it
      tableId: CCAnomalyEventsTable
      conditions:
      - !type:DepartmentCrewCondition
        departments: [ Science ]
        min: 2
    - !type:NestedSelector
      tableId: CCIonStormEventsTable
      prob: 0.3
    - !type:NestedSelector
      tableId: DerelictBorgEventTable
      prob: 0.5
    - !type:NestedSelector
      tableId: CCSyndicateInfiltrationTable
      prob: 0.8
    - !type:NestedSelector
      tableId: CCIrregularSleeperAgentsRepeatTable
      # Numerically above Medium's 0.14 on purpose: Easy's scheduler is much slower
      # (10-25 min band, gentler ramp) so it gets far fewer event rolls per shift. A higher
      # per-roll chance is what lands both tiers on a sensible round-level number.
      prob: 0.16
    - !type:NestedSelector
      tableId: CCInfiltratorEventsTable
      prob: 0.5
    - !type:NestedSelector
      tableId: CCIrregularHostileMobLightTable
      prob: 0.1

- type: entityTable
  id: CCIrregularMediumEventsTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: CCAmbientEventsTable
    - !type:NestedSelector
      tableId: CCVerminEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector
      tableId: CCAnomalyEventsTable
      conditions:
      - !type:DepartmentCrewCondition
        departments: [ Science ]
        min: 2
    - !type:NestedSelector
      tableId: CCIonStormEventsTable
      prob: 0.3
    - !type:NestedSelector
      tableId: DerelictBorgEventTable
      prob: 0.6
    - !type:NestedSelector
      tableId: CCSyndicateInfiltrationTable
      prob: 0.85
    - !type:NestedSelector
      tableId: CCIrregularSleeperAgentsRepeatTable
      prob: 0.14
    - !type:NestedSelector
      tableId: CCInfiltratorEventsTable
      prob: 0.6
    - !type:NestedSelector
      tableId: CCIrregularHostileMobLightTable
      prob: 0.2
    - !type:NestedSelector
      tableId: CCHostileMobHeavyTable
      prob: 0.08

- type: entityTable
  id: CCIrregularHardEventsTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: CCAmbientEventsTable
    - !type:NestedSelector
      tableId: CCVerminEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector
      tableId: CCAnomalyEventsTable
      conditions:
      - !type:DepartmentCrewCondition
