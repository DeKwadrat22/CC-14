# _ClawCommand: role loadouts for the senior job variants.
#
# Each mirrors its base job's group list, swapping in the Senior* groups for the slots that have
# senior-branded gear. Everything else (backpacks, belts, shoes, survival kits, CC14 extras) is
# the same group the base job uses, so seniors keep every ordinary department option.

- type: roleLoadout
  id: JobSeniorOfficer
  groups:
  - SecurityHead
  - SeniorOfficerJumpsuit
  - SecurityBackpack
  - SecurityOuterClothing
  - SecurityShoes
  - SeniorOfficerID
  - SecurityBelt
  - AssistiveItems
  - CCSecurityGloves # CC14
  - SurvivalSecurity
  - Rations # Claw Command
  - Trinkets
  - Instruments # CC14
  - CCEmergencyGear # CC14
  - CCFoodDrink # CC14
  - CCMiscItems # CC14
  - CCPlushiesToys # CC14
  - CCPets # CC14
  - SecurityJobTrinkets
  - GroupSpeciesBreathToolSecurity
  - CCServiceWeapon # Claw Command - service weapons
  - CCServiceEquipment # Claw Command - service weapons
  # Claw Command - imported wardrobe
  - CCWardrobeNeckwear
  # Claw Command - service-weapon budget. Six rather than five because
  # PointsCostLoadoutEffect rejects on `Points <= Cost`, so a five-point budget would make
  # the five-cost guns (Viper, Python, Viper Wood) permanently unselectable.
  points: 6

