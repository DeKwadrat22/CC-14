# Claw Command - loadout entries for the wardrobe imported from the Imperial Space public tree.
#
# Four pools live here, kept apart on purpose:
#
#   CCWardrobe*        cosmetic only - no armour, no storage, no pressure protection, nothing that
#                      changes how a round plays. Offered to every job that wears clothes, the same
#                      way CCPlushiesToys and CCPets already are.
#   CCCombat*          ordinary body armour, helmets and webbing. Security, the Claw Command
#                      Officer and the Captain only, since those are the roles that already pick
#                      armour at spawn. Nothing better than a 0.6 damage coefficient, so none of it
#                      outclasses the station's own security gear.
#   CCCaptainRegalia   the captain's dress uniforms, sheriff set and cloaks. Captain only.
#   CCSecurityRegalia  head of security's formal cloak and mantle, and the warden's mantle.
#
# Rank insignia is deliberately absent from the general pools and from the AutoDrobe - a costume
# vendor that hands out a captain's cloak is a free command disguise.
#
# Generated alongside Entities/Clothing/Imported/; regenerate both together.

