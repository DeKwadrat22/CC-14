# Claw Command - General loadout items available to all jobs
# Ported from space project's general loadout pools
#
# groupBy sub-categorization: variants of the same item type are grouped.
# Unique standalone items are left ungrouped.

# === Emergency Gear ===

# Breathing (air supply variants)
- type: loadout
  id: LoadoutBreathingMask
  groupBy: "breathing"
  storage:
    back:
    - ClothingMaskBreath

