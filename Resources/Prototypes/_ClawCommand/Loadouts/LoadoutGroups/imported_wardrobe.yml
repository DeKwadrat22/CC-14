# Claw Command - loadout groups for the imported wardrobe.
#
# Almost everything imported was folded into the group each job already has for that slot, so a
# security officer picks a new helmet inside SecurityHead and the captain picks a dress uniform
# inside CaptainJumpsuit - no parallel category sitting next to the real one.
#
# What is left here is the fallback for jobs that have no group for a slot at all. A passenger has
# no "head" category to merge into, so it gets one. Roles that do have a group never see these,
# which is why each is attached to a specific subset of roles rather than to everything.
#
# WardenNeck is not a wardrobe group: every other head-of-staff role already has a <Role>Neck
# group and the warden simply lacked one, so it follows that existing convention.

