# _ClawCommand: loadout groups for the senior job variants.
#
# Only the slots that actually have senior-branded gear get their own group; every other slot
# reuses the base job's group verbatim (see _ClawCommand/Loadouts/RoleLoadouts/seniors.yml), so
# a senior keeps all the ordinary department options and gains the senior ones on top.

# Security
- type: loadoutGroup
  id: SeniorOfficerJumpsuit
  name: loadout-group-senior-officer-jumpsuit
