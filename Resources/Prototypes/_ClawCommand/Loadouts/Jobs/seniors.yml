# _ClawCommand: senior-branded loadout items, moved here out of the base jobs' loadout files
# so they're only offered to the matching senior job.
#
# These used to sit in the Security/Engineering/Medical/Science/Cargo loadouts gated behind
# the Senior* loadoutEffectGroups (60h department). The senior jobs themselves now carry a
# 40h department requirement, so the per-item time gate is redundant and has been dropped -
# if you can pick the job, you can wear its uniform.
#
# Deliberately NOT moved: SeniorEngineerBeret and ScientificBeret. Despite the names those are
# the plain engineering / RND berets, not senior-branded gear, so they stay available to
# Station Engineers and Scientists on their existing timers.

# Security
- type: loadout
  id: SeniorOfficerJumpsuit
  equipment:
    jumpsuit: ClothingUniformJumpsuitSeniorOfficer

- type: loadout
  id: SeniorOfficerJumpskirt
