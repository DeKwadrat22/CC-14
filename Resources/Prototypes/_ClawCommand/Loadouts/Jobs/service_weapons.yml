# Three picks stands in for space's separate "spare" duplicates: rather than a second prototype per
# magazine, the group limit is what lets an officer pack extra.
- type: loadoutGroup
  id: CCServiceEquipment
  name: loadout-group-cc-service-equipment
  minLimit: 0
  maxLimit: 3
  loadouts:
