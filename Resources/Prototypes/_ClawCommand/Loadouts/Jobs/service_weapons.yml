# _ClawCommand: service weapons, ported from the `space` fork's Security weapons loadouts.
#
# Costs are space's, unchanged. The role's points budget lives on the roleLoadout prototypes in
# _ClawCommand/Loadouts/RoleLoadouts/service_weapons.yml; a zero-cost pick carries no effect at all
# so it stays free even for roles with no budget.
#
# Everything here hands out a *CCIssued / *BarkeepIssued variant - the non-contraband twins in
# _ClawCommand/Entities/Objects/Weapons/issued_weapons.yml - so a service member is never carrying
# something their own department would book them for.
#
# Deliberately absent: the Head of Security and Warden job-specific weapons (WeaponDisablerSMG,
# WeaponSecurityEnergyShotgun) and the energy revolver, which needs C# this fork does not have.

# ---------------------------------------------------------------------------
