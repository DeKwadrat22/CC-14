# Dogborg borg types. Each entry mirrors the matching department borgType
# (medical / engineering / etc.) in Resources/Prototypes/borg_types.yml but
# substitutes the sprite state names for the dogborg variant. This is needed
# because BorgSwitchableTypeSystem runs at startup and would otherwise overwrite
# the dogborg sprite layers with the upstream `robot`/`medical`/etc. state names.

# ===== Security =====
- type: borgType
  id: dogborg-k9
  selectable: false
  dummyPrototype: BorgChassisSecurityK9
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
  radioChannels:
  - Security
  inventoryTemplateId: borgShort
  spriteBodyState: k9
  spriteBodyMovementState: k9_moving
  spriteHasMindState: k9_e
  spriteNoMindState: k9
  spriteToggleLightState: k9_l
  spriteWreckState: k9-wreck
  spriteSitState: k9-sit
  spriteRestState: k9-rest
  spriteBellyUpState: k9-bellyup
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg

- type: borgType
  id: dogborg-k9-dark
  selectable: false
  dummyPrototype: BorgChassisSecurityK9Dark
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
  radioChannels:
  - Security
  inventoryTemplateId: borgShort
  spriteBodyState: k9dark
  spriteBodyMovementState: k9dark_moving
  spriteHasMindState: k9dark
  spriteNoMindState: k9dark
  spriteToggleLightState: k9dark
  spriteWreckState: k9dark-wreck
  spriteSitState: k9dark-sit
  spriteRestState: k9dark-rest
  spriteBellyUpState: k9dark-bellyup
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg

- type: borgType
  id: dogborg-vale-sec
  selectable: false
  dummyPrototype: BorgChassisSecurityVale
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
  radioChannels:
  - Security
  inventoryTemplateId: borgShort
  spriteBodyState: valesec
  spriteBodyMovementState: valesec_moving
  spriteHasMindState: valesec_e
  spriteNoMindState: valesec
  spriteToggleLightState: valesec_l
  spriteWreckState: valesec-wreck
  spriteSitState: valesec-sit
  spriteRestState: valesec-rest
  spriteBellyUpState: valesec-bellyup
