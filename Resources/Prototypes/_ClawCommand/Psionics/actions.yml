- type: entity
  id: ActionHealingWord
  name: Healing Word
  description: Speak the Lesser Secret Of Life, and restore health to another.
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      icon: { sprite: Interface/Actions/psionics.rsi, state: healing_word }
      useDelay: 10
      itemIconStyle: BigAction
    - type: TargetAction
      checkCanAccess: false
      range: 6
    - type: EntityTargetAction
      canTargetSelf: true
      blacklist:
        components:
          - PsionicInsulation
          - Mindbroken
      event: !type:PsionicHealOtherPowerActionEvent
        healingAmount:
          # Claw Command - DamageSpecifier no longer takes a `groups:` wrapper; these are the same values
          # the group form expanded to, written per damage type.
          types:
            Cellular: -2.5
            Poison: -5
            Asphyxiation: -5
            Blunt: -2.5
            Slash: -2.5
            Piercing: -2.5
            Heat: -5
            Shock: -5
        rotReduction: 10
        useDelay: 1
        doRevive: true
        powerName: Healing Word
        popupText: healing-word-begin
        playSound: true
        minGlimmer: 2
        maxGlimmer: 4
        glimmerSoundThreshold: 100
        glimmerPopupThreshold: 200
        glimmerDoAfterVisibilityThreshold: 70

- type: entity
  id: ActionRevivify
  name: Breath of Life
  description: Speak the Greater Secret of Life, and restore another to life.
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      icon: { sprite: Interface/Actions/psionics.rsi, state: revivify }
      useDelay: 120
      itemIconStyle: BigAction
    - type: TargetAction
      checkCanAccess: false
      range: 2
    - type: EntityTargetAction
      canTargetSelf: false
      blacklist:
        components:
          - PsionicInsulation
          - Mindbroken
      event: !type:PsionicHealOtherPowerActionEvent
        healingAmount:
          # Claw Command - as above, the group values written out per damage type.
          # Multiplied by the caster's Amplification on use.
          types:
            Cellular: -15
            Poison: -30
            Asphyxiation: -60
            Blunt: -15
            Slash: -15
            Piercing: -15
            Heat: -30
            Shock: -30
        rotReduction: 60
        doRevive: true
        powerName: Revivify
        popupText: revivify-begin
        playSound: true
        minGlimmer: 10 # These also get multiplied by caster stats. So,
        maxGlimmer: 15 # keeping in mind the ~3.5x multiplier, this spikes glimmer by as much as 60 points.
        glimmerSoundThreshold: 50
        glimmerPopupThreshold: 100
        glimmerDoAfterVisibilityThreshold: 35

- type: entity
  id: ActionAssay
  name: Assay
  description: Probe an entity at close range to glean metaphorical information about any powers they may have
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      icon: { sprite: Interface/Actions/psionics.rsi, state: assay }
      useDelay: 45
      itemIconStyle: BigAction
    - type: TargetAction
      checkCanAccess: false
      range: 2
    - type: EntityTargetAction
      canTargetSelf: true
      blacklist:
        components:
          - PsionicInsulation
          - Mindbroken
      event: !type:AssayPowerActionEvent

- type: entity
  id: ActionSummonRemilia
  name: Summon Remilia
  description: Call forth your ever-loyal familiar Remilia.
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      icon: { sprite: Interface/Actions/psionics.rsi, state: summon_remilia }
      useDelay: 120
      checkCanInteract: false
    - type: InstantAction
      event: !type:SummonPsionicFamiliarActionEvent
        familiarProto: MobBatRemilia
        powerName: "Summon Remilia"
        checkInsulation: true
        doGlimmerEffects: true
        followMaster: true
        minGlimmer: 5
        maxGlimmer: 10

# Claw Command - ActionShadeskip, ActionTelekineticPulse, ActionPyrokineticFlare and ActionSummonImp are NOT
# ported. Each depends on an entity this fork does not have and that is not psionics content in itself:
#   ActionShadeskip        -> ShadowKudzuWeak + EffectFlashShadeskip
#   ActionTelekineticPulse -> EffectFlashTelekineticPulse
#   ActionPyrokineticFlare -> EffectPyrokineticFlare
#   ActionSummonImp        -> MobPsionicFamiliarImp
# Their powers are likewise commented out of psionic_power_pool.yml, so nothing references them.
# The AnomalyPowerSystem that drives the first three IS ported, so re-adding them later is only a matter of
# bringing over those effect/mob prototypes.
