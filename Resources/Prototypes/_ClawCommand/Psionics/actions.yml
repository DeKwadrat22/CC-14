# Claw Command - psionics port.
#
# The action system was split since the fork this came from. Fields that used to live on
# EntityTargetAction / WorldTargetAction / InstantAction now belong to:
#   - type: Action        -> icon, iconOn, useDelay, itemIconStyle, checkCanInteract, priority
#   - type: TargetAction  -> range, checkCanAccess
#   - the specific action -> event, whitelist/blacklist, canTargetSelf
# Leaving them on the old component silently dropped them (the serializer ignores unknown fields), which
# would have meant no icons, no cooldowns and default range on every psionic power.

- type: entity
  id: ActionDispel
  name: Dispel
  description: Dispel summoned entities such as familiars or forcewalls.
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      icon: Interface/VerbIcons/dispel.png
      useDelay: 45
      itemIconStyle: BigAction
    - type: TargetAction
      checkCanAccess: false
      range: 6
    - type: EntityTargetAction
      canTargetSelf: false
      blacklist:
        components:
          - PsionicInsulation
          - Mindbroken
      event: !type:DispelPowerActionEvent

- type: entity
  id: ActionMassSleep
  name: Mass Sleep
  description: Put targets in a small area to sleep.
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      icon: Interface/VerbIcons/mass_sleep.png
      useDelay: 60
      itemIconStyle: BigAction
    - type: TargetAction
      checkCanAccess: false
      range: 8
    - type: WorldTargetAction
      event: !type:MassSleepPowerActionEvent

