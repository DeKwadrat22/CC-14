      event: !type:SummonPsionicFamiliarActionEvent
        familiarProto: MobBatRemilia
        powerName: "Summon Remilia"
        checkInsulation: true
        doGlimmerEffects: true
        followMaster: true
        minGlimmer: 5
        maxGlimmer: 10

# Claw Command - ActionShadeskip, ActionTelekineticPulse, ActionPyrokineticFlare and ActionSummonImp are NOT
# ported. Each depends on an entity this fork does not have and that is not psionics content in itself:
#   ActionShadeskip        -> ShadowKudzuWeak + EffectFlashShadeskip
#   ActionTelekineticPulse -> EffectFlashTelekineticPulse
#   ActionPyrokineticFlare -> EffectPyrokineticFlare
#   ActionSummonImp        -> MobPsionicFamiliarImp
# Their powers are likewise commented out of psionic_power_pool.yml, so nothing references them.
# The AnomalyPowerSystem that drives the first three IS ported, so re-adding them later is only a matter of
# bringing over those effect/mob prototypes.
