# Claw Command - psionics port: bluespace crystals.
#
# The glimmer prober and glimmer drain are both constructed from bluespace crystals, so the material had to
# come over with them. The sprite states already exist in Objects/Materials/materials.rsi.
#
# Upstream's MaterialBluespace also carried `EtherealStunItem` and an `EmitSoundOnUse` RadiationPulse; both are
# dropped here. EtherealStunItem does not exist in this fork, and the sound is incidental.

- type: material
  id: Bluespace
  stackEntity: MaterialBluespace1
  name: materials-bluespace
  unit: materials-unit-piece
  icon: { sprite: Objects/Materials/materials.rsi, state: bluespace }
  color: "#53a9ff"
  price: 7.5

- type: stack
  id: Bluespace
  name: materials-bluespace
  icon: { sprite: Objects/Materials/materials.rsi, state: bluespace }
  spawn: MaterialBluespace1
  maxCount: 5

- type: Tag
  id: BluespaceCrystal

- type: entity
  parent: MaterialBase
  id: MaterialBluespace
  suffix: Full
  name: bluespace crystal
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    layers:
    - state: bluespace_3
      map: ["base"]
  - type: Appearance
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Bluespace: 100
  - type: Tag
    tags:
    - BluespaceCrystal
    - RawMaterial
  - type: Stack
    stackType: Bluespace
    baseLayer: base

- type: entity
  parent: MaterialBluespace
  id: MaterialBluespace1
  suffix: 1
  components:
  - type: Sprite
    state: bluespace
  - type: Stack
    count: 1

- type: entity
  parent: MaterialBluespace1
  id: MaterialBluespace3
  suffix: 3
  components:
  - type: Stack
    count: 3

- type: entity
  parent: MaterialBluespace1
  id: MaterialBluespace5
  suffix: 5
  components:
  - type: Stack
    count: 5
