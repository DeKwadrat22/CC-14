# Claw Command - psionics port: the glimmer monitor PDA program.
#
# Parented to BasePDACartridge (the fork's cartridge base) rather than upstream's BaseItem, so it inherits the
# cartridge sprite and item behaviour like every other program here.

- type: entity
  parent: BasePDACartridge
  id: GlimmerMonitorCartridge
  name: glimmer monitor cartridge
  description: A cartridge that keeps track of glimmer.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Devices/cartridge.rsi
    state: cart-psi
  - type: Icon
    sprite: Nyanotrasen/Objects/Devices/cartridge.rsi
    state: cart-psi
  - type: UIFragment
    ui: !type:GlimmerMonitorUi
  - type: Cartridge
    programName: glimmer-monitor-program-name
    icon:
      sprite: Nyanotrasen/Icons/psi.rsi
      state: psi
  - type: GlimmerMonitorCartridge
