## Regular station events
# Claw Command - space declares `startAnnouncement: true` because its StationEventComponent field is a
# bool, and its AnnouncerSystem derived both the message and the per-announcer voice line from the rule id.
# This fork tracks upstream, where StartAnnouncement is a LocId string and the sound is a separate
# StartAudio field. Carrying `true` across verbatim made the announcement resolve the literal message id
# "true" and play nothing at all, so both are spelled out here. The audio is space's NEIL announcer clip.
- type: entity
  id: NoosphericStorm
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
    - type: StationEvent
      startAnnouncement: station-event-noospheric-storm-announcement
      startAudio:
        path: /Audio/_ClawCommand/Announcements/noospheric_storm.ogg
      weight: 5
      earliestStart: 15
      reoccurrenceDelay: 5
    - type: NoosphericStormRule

# Claw Command - upstream's mid-round antag spawner rules (BaseMidRoundAntag / RatKingSpawn /
# ParadoxAnomalySpawn) are NOT part of this port. They are not psionics content, this fork already handles
# rat king and paradox anomaly through its own event set, and adding a second scheduler for them would make
# both fire. The MidRoundAntagSpawnLocationComponent marker is still ported, because glimmer creature events
# use it as a hidden-spawn fallback.

# Base glimmer event
- type: entity
  id: BaseGlimmerEvent
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
    - type: StationEvent
      # Favor glimmer events just a little more than regular events.
      weight: 12
    - type: GlimmerEvent

## Glimmer events
# Blank discharge
- type: entity
  id: MundaneDischarge
  parent: BaseGlimmerEvent
  categories: [ HideSpawnMenu ]
  components:
    - type: StationEvent
      reoccurrenceDelay: 15
    - type: GlimmerEvent
      maximumGlimmer: 300
      glimmerBurnLower: 18
      glimmerBurnUpper: 40
    - type: MundaneDischargeRule

- type: entity
  id: NoosphericZap
  parent: BaseGlimmerEvent
  categories: [ HideSpawnMenu ]
  components:
    - type: StationEvent
      weight: 25 # Guaranteed to happen every once in a while, but with intervals between incidents
      reoccurrenceDelay: 15
    - type: GlimmerEvent
    - type: NoosphericZapRule

# Fry tinfoil hats and shoot lightnings from probers
- type: entity
  id: NoosphericFry
  parent: BaseGlimmerEvent
  categories: [ HideSpawnMenu ]
  components:
    - type: GlimmerEvent
      minimumGlimmer: 550
      maximumGlimmer: 1000
    - type: NoosphericFryRule

- type: entity
  id: PsionicCatGotYourTongue
  parent: BaseGlimmerEvent
  categories: [ HideSpawnMenu ]
  components:
    - type: GlimmerEvent
      minimumGlimmer: 400
      maximumGlimmer: 1000
      glimmerBurnLower: 18
      glimmerBurnUpper: 40
    - type: PsionicCatGotYourTongueRule

