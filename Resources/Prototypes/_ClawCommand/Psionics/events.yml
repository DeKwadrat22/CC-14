    weight: 7
    duration: 1
    earliestStart: 15
    reoccurrenceDelay: 15
    minimumPlayers: 1
  - type: GlimmerEvent
    minimumGlimmer: 350
    maximumGlimmer: 1000
  - type: GlimmerRandomSentienceRule

- type: entity
  parent: BaseGlimmerSignaturesEvent
  id: GlimmerRevenantSpawn
  categories: [ HideSpawnMenu ]
  components:
    - type: GlimmerEvent
      minimumGlimmer: 450
      maximumGlimmer: 900
      glimmerBurnLower: 50
      glimmerBurnUpper: 100 # Gives epi a chance to recover
    - type: GlimmerRevenantRule

- type: entity
