# Claw Command - psionics port: Forensic Mantis clothing.
#
# Only the three garments the fork was missing are defined here. The jumpsuit, jumpskirt, fez and winter coat
# already ship in _ClawCommand/Entities/Clothing/{Uniforms,Head,OuterClothing}, so redefining them here would
# be a duplicate ID. All sprites were already present under Textures/Nyanotrasen.

- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterCoatMantis
  name: mantis' jacket
  description: Modeled after an ancient infantry uniform, this jacket may guard you against the unknown in your journey for the truth.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/OuterClothing/Coats/mantis_jacket.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/OuterClothing/Coats/mantis_jacket.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
  - type: TemperatureProtection
    coefficient: 0.3

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltMantis
  name: mantis' belt
  description: Perfect for storing all of your equipment.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/Belt/mantis_belt.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/Belt/mantis_belt.rsi
  - type: Storage
    whitelist:
      tags:
        - Document
        - Flashlight
        - ForensicBeltEquip
        - HandLabeler

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesBootsMantis
  name: mantis' boots
  description: Soft, comfortable, and good for rough terrain.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/Shoes/Boots/mantis_boots.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/Shoes/Boots/mantis_boots.rsi
