  - sprite: /Textures/Interface/Alerts/mana.rsi
    state: power2
  - sprite: /Textures/Interface/Alerts/mana.rsi
    state: power3
  - sprite: /Textures/Interface/Alerts/mana.rsi
    state: power4
  - sprite: /Textures/Interface/Alerts/mana.rsi
    state: power5
  - sprite: /Textures/Interface/Alerts/mana.rsi
    state: power6
  - sprite: /Textures/Interface/Alerts/mana.rsi
