# Claw Command - Shadekin species ported from Floofstation/ADT
- type: markingsGroup
  parent: Undergarments
  id: MarkingsShadowkin
  limits:
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ TailShadowkin ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ EarsShadowkin ]
    enum.HumanoidVisualLayers.Chest:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Genital:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Penis:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Breasts:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceShadowkin
  suffix: Claw Command
  name: shadekin appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganShadowkinTorso
      Head: OrganShadowkinHead
      ArmLeft: OrganShadowkinArmLeft
      ArmRight: OrganShadowkinArmRight
      HandRight: OrganShadowkinHandRight
      HandLeft: OrganShadowkinHandLeft
      LegLeft: OrganShadowkinLegLeft
      LegRight: OrganShadowkinLegRight
      FootLeft: OrganShadowkinFootLeft
      FootRight: OrganShadowkinFootRight
      Brain: OrganShadowkinBrain
      Eyes: OrganShadowkinEyes
      Tongue: OrganShadowkinTongue
      Appendix: OrganShadowkinAppendix
      Ears: OrganShadowkinEars
      Lungs: OrganShadowkinLungs
      Heart: OrganShadowkinHeart
      Stomach: OrganShadowkinStomach
      Liver: OrganShadowkinLiver
      Kidneys: OrganShadowkinKidneys
  - type: HumanoidProfile
    species: SpeciesShadowkin

- type: entity
  parent:
  - AppearanceShadowkin
  - BaseSpeciesMobOrganic
  id: MobShadowkin
  name: Urist McShadow
  suffix: Claw Command
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 3
  - type: Vocal
    sounds:
      Male: MaleShadowkin
      Female: FemaleShadowkin
      Unsexed: MaleShadowkin
  - type: Speech
    speechSounds: Alto
    allowedEmotes: [ 'Mars', 'Wurble', 'Bark', 'Snarl', 'Whine', 'Howl', 'Growl', 'Mew', 'Purr', 'Yip', 'Yap', 'Gekker', 'CatMeow', 'CatHisses' ]
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Damageable
    damageModifierSet: ModifierSetShadowkin
  - type: TypingIndicator
    proto: alien
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 4.5
  - type: Temperature
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 330
    coldDamageThreshold: 195
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 0.25
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      180: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      48: 0.85
      64: 0.65
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 130
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Flammable
    damage:
      types:
        Heat: 1.5
  - type: DamageForceSay
    forceSayStringDataset: ForceSayStringDatasetShadowkin # Custom dataset, see 'Datasets/damage_force_say.yml'

# Organ definitions
- type: entity
  parent: OrganBase
  id: OrganShadowkin
  abstract: true
  suffix: shadowkin

- type: entity
  id: OrganShadowkinMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganShadowkin
  id: OrganShadowkinInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Shadowkin/organs.rsi

- type: entity
  id: OrganShadowkinVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _ClawCommand/Mobs/Species/Shadowkin/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: MarkingsShadowkin

- type: entity
  parent: [ OrganShadowkin, OrganShadowkinVisual ]
  id: OrganShadowkinExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Shadowkin/parts.rsi

# External organs (body parts)
- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganShadowkinExternal ]
  id: OrganShadowkinTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganShadowkinExternal ]
  id: OrganShadowkinHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair

- type: entity
  parent: [ OrganBaseArmLeft, OrganShadowkinExternal ]
  id: OrganShadowkinArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganShadowkinExternal ]
  id: OrganShadowkinArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganShadowkinExternal ]
  id: OrganShadowkinHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganShadowkinExternal ]
  id: OrganShadowkinHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganShadowkinExternal ]
  id: OrganShadowkinLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganShadowkinExternal ]
  id: OrganShadowkinLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganShadowkinExternal ]
  id: OrganShadowkinFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganShadowkinExternal ]
  id: OrganShadowkinFootRight

# Internal organs
- type: entity
  parent: [ OrganBaseBrain, OrganSpriteHumanInternal, OrganShadowkinInternal ]
  id: OrganShadowkinBrain

- type: entity
  parent: [ OrganShadowkinVisual, OrganBaseEyes, OrganShadowkinInternal ]
  id: OrganShadowkinEyes
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Shadowkin/organs.rsi
    layers:
    - state: eyes
  - type: VisualOrgan
    data:
      sprite: _ClawCommand/Mobs/Species/Shadowkin/parts.rsi
      state: eyes

- type: entity
  parent: [ OrganBaseTongue, OrganShadowkinInternal ]
  id: OrganShadowkinTongue

- type: entity
  parent: [ OrganBaseAppendix, OrganSpriteHumanInternal, OrganShadowkinInternal ]
  id: OrganShadowkinAppendix

- type: entity
  parent: [ OrganBaseEars, OrganSpriteHumanInternal, OrganShadowkinInternal ]
  id: OrganShadowkinEars

- type: entity
  parent: [ OrganBaseLungs, OrganShadowkinInternal, OrganShadowkinMetabolizer ]
  id: OrganShadowkinLungs
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Shadowkin/organs.rsi
    layers:
    - state: lungs

- type: entity
  parent: [ OrganBaseHeart, OrganShadowkinInternal, OrganShadowkinMetabolizer ]
  id: OrganShadowkinHeart
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Shadowkin/organs.rsi
    layers:
    - state: heart

- type: entity
  parent: [ OrganBaseStomach, OrganShadowkinInternal, OrganShadowkinMetabolizer ]
  id: OrganShadowkinStomach

- type: entity
  parent: [ OrganBaseLiver, OrganSpriteHumanInternal, OrganShadowkinInternal, OrganShadowkinMetabolizer ]
  id: OrganShadowkinLiver

- type: entity
  parent: [ OrganBaseKidneys, OrganSpriteHumanInternal, OrganShadowkinInternal, OrganShadowkinMetabolizer ]
  id: OrganShadowkinKidneys
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Shadowkin/organs.rsi
    layers:
    - state: kidneys
