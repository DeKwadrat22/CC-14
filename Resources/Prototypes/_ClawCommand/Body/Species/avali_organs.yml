# _ClawCommand: Avali organs.
# Mirrors the Felinid organ wiring (felinid_organs.yml) so the human body sprite + the species's
# markings group are picked up. Avali don't have a custom metabolizer in space, so we use the
# generic OrganHumanMetabolizer pattern (no MetabolizerAvali). Stomach allows omnivore digestion.

- type: entity
  parent: OrganBase
  id: OrganAvaliBase
  abstract: true
  suffix: Claw Command, Avali

- type: entity
  parent: OrganAvaliBase
  id: OrganAvaliInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganAvaliBase
  id: OrganAvaliExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: MarkingsAvali

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganAvaliExternal ]
  id: OrganAvaliTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganAvaliExternal ]
  id: OrganAvaliHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

- type: entity
  parent: [ OrganBaseArmLeft, OrganAvaliExternal ]
  id: OrganAvaliArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganAvaliExternal ]
  id: OrganAvaliArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganAvaliExternal ]
  id: OrganAvaliHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganAvaliExternal ]
  id: OrganAvaliHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganAvaliExternal ]
  id: OrganAvaliLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganAvaliExternal ]
  id: OrganAvaliLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganAvaliExternal ]
  id: OrganAvaliFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganAvaliExternal ]
  id: OrganAvaliFootRight

- type: entity
  parent: [ OrganBaseBrain, OrganAvaliInternal ]
  id: OrganAvaliBrain

- type: entity
  parent: [ OrganBaseEyes, OrganAvaliInternal, OrganAvaliExternal ]
  id: OrganAvaliEyes
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Customization/eyes.rsi

- type: entity
  parent: [ OrganBaseTongue, OrganAvaliInternal ]
  id: OrganAvaliTongue

- type: entity
  parent: [ OrganBaseAppendix, OrganAvaliInternal ]
  id: OrganAvaliAppendix

- type: entity
  parent: [ OrganBaseEars, OrganAvaliInternal ]
  id: OrganAvaliEars

- type: entity
  parent: [ OrganBaseLungs, OrganAvaliInternal ]
  id: OrganAvaliLungs

- type: entity
  parent: [ OrganBaseHeart, OrganAvaliInternal ]
  id: OrganAvaliHeart

- type: entity
  parent: [ OrganBaseStomach, OrganAvaliInternal ]
  id: OrganAvaliStomach
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
      - Vegetable
      - Pill
      - TagNutribrick

- type: entity
  parent: [ OrganBaseLiver, OrganAvaliInternal ]
  id: OrganAvaliLiver

- type: entity
  parent: [ OrganBaseKidneys, OrganAvaliInternal ]
  id: OrganAvaliKidneys
