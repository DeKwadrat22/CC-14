- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceTajaran
  categories: [ HideSpawnMenu ]
  suffix: Claw Command
  name: tajaran appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganTajaranTorso
      Head: OrganTajaranHead
      ArmLeft: OrganTajaranArmLeft
      ArmRight: OrganTajaranArmRight
      HandRight: OrganTajaranHandRight
      HandLeft: OrganTajaranHandLeft
      LegLeft: OrganTajaranLegLeft
      LegRight: OrganTajaranLegRight
      FootLeft: OrganTajaranFootLeft
      FootRight: OrganTajaranFootRight
      Brain: OrganTajaranBrain
      Eyes: OrganTajaranEyes
      Tongue: OrganTajaranTongue
      Appendix: OrganTajaranAppendix
      Ears: OrganTajaranEars
      Lungs: OrganTajaranLungs
      Heart: OrganTajaranHeart
      Stomach: OrganTajaranStomach
      Liver: OrganTajaranLiver
      Kidneys: OrganTajaranKidneys
  - type: HumanoidProfile
    species: SpeciesTajaran

- type: entity
  parent:
  - AppearanceTajaran
  - BaseSpeciesMobOrganic
  id: MobTajaran
  name: Urist McTajaran
  suffix: Claw Command
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Vocal
    sounds:
      Male: UnisexFelinid
      Female: FemaleFelinid
      Unsexed: UnisexFelinid
  - type: Speech
    speechSounds: Cat
    speechVerb: SpeechFelinid
    allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Howl', 'Growl', 'Mew', 'Purr', 'Yip', 'Yap', 'Gekker', 'CatMeow', 'CatHisses' ]
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      collection: Punch
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: TemperatureProtection
    heatingCoefficient: 0.1 # Lower heat threshold, according to other servers.
  - type: JumpAbility
    action: ActionVulpkaninGravityJump
    canCollide: true
    jumpDistance: 2
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: 1.33
        volume: -5
        variation: 0.05
  - type: Damageable
    damageModifierSet: ModifierSetFelinid
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-generic
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_meow.ogg
