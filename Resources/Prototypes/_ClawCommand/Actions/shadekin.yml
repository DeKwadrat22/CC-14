# Shadekin ability actions ported from Floofstation.
- type: entity
  parent: BaseAction
  id: ShadekinActionPhase
  name: Phase Shift
  description: Shift yourself out of alignment with realspace to travel quickly to different areas.
  categories: [HideSpawnMenu]
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    checkCanInteract: false
    useDelay: 6
    priority: 4
    icon:
      sprite: _ClawCommand/Interface/Actions/shadowkin_icons.rsi
      state: darkswap
    event: !type:ShadekinPhaseActionEvent

- type: entity
  parent: BaseAction
  id: ShadekinDarkVision
  name: Darkvision
  description: Switches dark vision.
  categories: [HideSpawnMenu]
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    checkCanInteract: false
    priority: 5
    icon:
      sprite: _ClawCommand/Interface/Actions/shadowkin_icons.rsi
      state: shadeskip
    event: !type:ToggleNightVisionEvent

- type: entity
  parent: BaseAction
  id: ShadekinActionSleep
  name: Rest
  description: Rest and recover energy faster while you sleep.
  categories: [HideSpawnMenu]
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    priority: 6
    icon:
      sprite: _ClawCommand/Interface/Actions/shadowkin_icons.rsi
      state: rest
    event: !type:SleepActionEvent

- type: entity
  parent: BaseAction
  id: ShadekinActionRejuvenate
  name: Rejuvenate
  description: rejuvenate yourself... hopefully.
  categories: [HideSpawnMenu]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: _ClawCommand/Interface/Actions/shadekin_extra.rsi
      state: revivify
    event: !type:CritShadekinEvent
