# Coffee roasting graph (heat raw beans → light → medium → dark roast).
# Referenced by FoodCoffeeBeansRaw / Roasted* entities in _ClawCommand/.../coffee_beans.yml.
- type: constructionGraph
  id: Coffee
  start: start
  graph:

  - node: start
    edges:
    - to: light roasted coffee
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 365

  - node: light roasted coffee
    entity: FoodCoffeeBeansRoastedLight
    edges:
    - to: medium roasted coffee
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 375

  - node: medium roasted coffee
    entity: FoodCoffeeBeansRoastedMedium
    edges:
    - to: dark roasted coffee
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 385

  - node: dark roasted coffee
    entity: FoodCoffeeBeansRoastedDark
