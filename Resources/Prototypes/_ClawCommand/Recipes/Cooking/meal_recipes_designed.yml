# Claw Command — designed microwave recipes for fork foods that ship with no
# upstream/space recipe. Each recipe gives the chef a route to make a food
# that previously was vendor/cargo-only. Ingredient choices favour what's
# already routine in a fork kitchen (milk, cream, juices, ice, bowls).

# === SOUPS (fork-original / upstream entities lacking recipes) =============

- type: microwaveMealRecipe
  id: RecipeSoupBeet
  name: beet soup recipe
  result: FoodSoupBeet
  time: 15
  group: Soup
  reagents:
    Water: 10
  solids:
    FoodBowlBig: 1
    FoodTomato: 1
    FoodCabbage: 1
    FoodOnion: 1

