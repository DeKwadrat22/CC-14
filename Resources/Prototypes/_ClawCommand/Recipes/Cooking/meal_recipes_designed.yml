# NOTE: Croissants (FoodCroissantRaw / FoodCroissantRawCotton) are produced via
# CreateRawCroissant / CreateRawCottonCroissant *reactions* in
# ../../Reactions/food_extras.yml — they're ingredient-tier raw dough variants and
# follow the same reaction pattern the upstream uses for FoodDough / FoodDoughCotton.
#
# NOTE: Coffee bean roasts (FoodCoffeeBeansRoastedLight / Medium / Dark) are produced
# by the CoffeeRoast construction graph at progressive minTemperature steps — see
# ../Construction/Graphs/food/coffee_beans.yml. That's the same heat-driven pattern
# the steak graph uses for cooked meats.
