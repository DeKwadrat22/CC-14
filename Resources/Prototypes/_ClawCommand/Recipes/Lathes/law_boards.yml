# CLAW COMMAND - law boards are printable now that borgs take their laws from a board.
#
# Department lawsets print at that department's fabricator (medical techfab, security techfab); the rest,
# including the plain NT / Crewsimov replacement boards, come out of the science circuit imprinter since
# no other department has a fabricator that makes boards.

# Department boards

- type: latheRecipe
  parent: [ BaseCircuitboardRecipe, BaseCircuitryRecipeCategory ]
  id: MedicalCircuitBoard
  result: MedicalCircuitBoard

- type: latheRecipe
  parent: [ BaseCircuitboardRecipe, BaseCircuitryRecipeCategory ]
  id: SiliconPoliceCircuitBoard
  result: SiliconPoliceCircuitBoard

