# Claw Command — extra food reactions for fork-specific ingredients that
# ship without an upstream reaction to produce them. Follows the established
# upstream pattern in Resources/Prototypes/Recipes/Reactions/food.yml where
# basic prepared-ingredient items (Cheese, Chevre, Butter, CakeBatter, Dough)
# are produced by mixing reagents in a container.

# Frosting — ported from space/_Floof. Butter + Sugar -> a stack of frosting.
- type: reaction
  id: CreateFrosting
  impact: Low
  quantized: true
  conserveEnergy: false
  reactants:
    Butter:
      amount: 5
    Sugar:
      amount: 15
  effects:
    - !type:SpawnEntity
      entity: FoodFrosting

# Mozzarella — soft cheese made by acid-coagulating milk. Mirrors the upstream
# Curdling reaction (Milk + Enzyme -> FoodCheese) but uses vinegar in place of
# rennet, since rennet isn't a fork reagent.
- type: reaction
  id: CreateMozzarella
  impact: Low
  quantized: true
  conserveEnergy: false
  # _ClawCommand: set with lemon juice and enriched with cream rather than vinegar. Curd cheese below
  # needs less milk for the same milk+vinegar pair, so it always curdled first and mozzarella could
  # never reach its own threshold - the two have to differ by reagent, not just by amount.
  # Cream is renewable: heat milk past 320K and shake it (ReduceMilk).
  reactants:
    Milk:
      amount: 30
    Cream:
      amount: 10
    JuiceLemon:
      amount: 5
      catalyst: true
  effects:
    - !type:SpawnEntity
      entity: FoodMozzarella

# Curd cheese — same idea, lower yield / less milk. The two products are
# distinct ingredients in the fork (mozzarella for melty dishes, curd cheese
# for crumbly ones), so they each get their own reaction.
- type: reaction
  id: CreateCurdCheese
  impact: Low
  quantized: true
  conserveEnergy: false
  reactants:
    Milk:
      amount: 20
    Vinegar:
      amount: 5
      catalyst: true
  effects:
    - !type:SpawnEntity
      entity: FoodCurdCheese

- type: reaction
  # _ClawCommand: tomato sauce used to be tomato juice + salt + capsaicin oil, which is the same reagent
  # set as vanilla's CookingHotsauce - and hot sauce only needs 1u of each, so it always fired first and
  # ate the juice before 20u could ever build up. Tomato sauce was unmakeable, and the 20/5/5 price for 3u
  # was brutal besides. These are Delta-V's recipes (https://github.com/DeltaV-Station/Delta-v): an oil
  # instead of chili oil, which both deconflicts it from hot sauce and drops the cost to something sane.
  id: CookingTomatoSauceOlive
  reactants:
    OilOlive:
      amount: 1
    TableSalt:
      amount: 1
    JuiceTomato:
      amount: 1
  products:
    TomatoSauce: 3

- type: reaction
  id: CookingTomatoSauceCorn
  reactants:
    Cornoil:
      amount: 1
    TableSalt:
      amount: 1
    JuiceTomato:
      amount: 1
  products:
    TomatoSauce: 3

# _ClawCommand: the Pesto reagent shipped with the Nyanotrasen condiments port and the moth pizza recipes
# call for it, but nothing ever made it. Delta-V's recipe, garlic (Allicin) being the pesto part.
- type: reaction
  id: CookingPesto
  reactants:
    OilOlive:
      amount: 1
    TableSalt:
      amount: 1
    Allicin:
      amount: 1
  products:
    Pesto: 3

# NOTE: Croissants (FoodCroissantRaw / FoodCroissantRawCotton) are produced by
# slicing FoodDoughFlat / FoodDoughCottonFlat (SliceableFood, count: 4). That's
# how upstream works — no reaction is needed.
