# _ClawCommand: Avali speech sound profiles.
# Ported from space/Resources/Prototypes/_Floof/Voice/avali_speech_sounds.yml — same IDs (MaleAvali,
# FemaleAvali) so any future Avali-using protos line up with space's expectations, just with audio
# paths repointed to our _ClawCommand tree.

- type: speechSounds
  id: MaleAvali
  saySound:
    path: /Audio/_ClawCommand/Voice/Avali/avali_1.ogg
  askSound:
    path: /Audio/_ClawCommand/Voice/Avali/avali_1_ask.ogg
  exclaimSound:
    path: /Audio/_ClawCommand/Voice/Avali/avali_1_exclaim.ogg

- type: speechSounds
  id: FemaleAvali
  saySound:
    path: /Audio/_ClawCommand/Voice/Avali/avali_2.ogg
  askSound:
    path: /Audio/_ClawCommand/Voice/Avali/avali_2_ask.ogg
  exclaimSound:
    path: /Audio/_ClawCommand/Voice/Avali/avali_2_exclaim.ogg
