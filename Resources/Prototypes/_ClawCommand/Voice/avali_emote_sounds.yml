# _ClawCommand: Avali emote sound bindings.
# Adapted from space/Resources/Prototypes/_Floof/Voice/avali_emote_sounds.yml. Bindings to sound
# collections the fork doesn't ship (ResomiChirps, HarpyCoos) are omitted rather than left dangling.

- type: soundCollection
  id: AvaliScreams
  files:
  - /Audio/_ClawCommand/Voice/Avali/avali_scream.ogg

- type: soundCollection
  id: AvaliLaughs
  files:
  - /Audio/_ClawCommand/Voice/Avali/avali_laugh.ogg

- type: emoteSounds
  id: MaleAvali
  params:
    variation: 0.125
  sounds:
    Scream:
      collection: AvaliScreams
    Laugh:
      collection: AvaliLaughs
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    CatMeow:
      collection: CatMeows
    CatHisses:
      collection: CatHisses
    MonkeyScreeches:
      collection: MonkeyScreeches
    RobotBeep:
      collection: RobotBeeps
    Yawn:
      collection: MaleYawn
    Snore:
      collection: Snores
    Honk:
      collection: BikeHorn
    Sigh:
      collection: MaleSigh
    Crying:
      collection: MaleCry
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh

- type: emoteSounds
  id: FemaleAvali
  params:
    variation: 0.125
  sounds:
    Scream:
      collection: AvaliScreams
    Laugh:
      collection: AvaliLaughs
    Sneeze:
      collection: FemaleSneezes
    Cough:
      collection: FemaleCoughs
    CatMeow:
      collection: CatMeows
    CatHisses:
      collection: CatHisses
    MonkeyScreeches:
      collection: MonkeyScreeches
    RobotBeep:
      collection: RobotBeeps
    Yawn:
      collection: FemaleYawn
    Snore:
      collection: Snores
    Honk:
      collection: CluwneHorn
    Sigh:
      collection: FemaleSigh
    Crying:
      collection: FemaleCry
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
