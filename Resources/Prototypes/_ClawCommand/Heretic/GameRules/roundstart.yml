- type: entity
  parent: BaseGameRule
  id: Heretic
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 15
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  # Claw Command - migrated to upstream's new AntagSelection API (Antags: AntagCountSelector[]).
  # The dropped definitions-level fields (chaosScore, Chaplain jobBlacklist, CommandStaff blacklist)
  # were either runtime-inert ClawCommand extensions or redundant with RestrictedAntag inheritance.
  - type: AntagSelection
    selectionTime: JobsAssigned
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Heretic
      range:
        min: 1
        max: 3
      playerRatio: 15
  - type: Tag
    tags:
      - RoundstartAntag

- type: entity
  parent: BaseGameRule
  id: CalmHeretic
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 15
    # Claw Command - CalmHeretic is only ever rolled as a sub-gamemode, so falling under
    # minPlayers must not cancel the preset that rolled it.
    cancelPresetOnTooFewPlayers: false
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    selectionTime: JobsAssigned
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Heretic
      range:
        min: 1
        max: 2
      playerRatio: 20
  - type: Tag
    tags:
      - CalmAntag
