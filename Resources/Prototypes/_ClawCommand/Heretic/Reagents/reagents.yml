- type: flavor
  id: eldritch
  flavorType: Complex
  description: flavor-complex-eldritch

- type: reagent
  id: EldritchEssence
  parent: BaseDrink
  group: Unknown
  name: reagent-name-eldritch
  desc: reagent-desc-eldritch
  physicalDesc: reagent-physical-desc-eldritch
  flavor: eldritch
  color: "#1f8016"
  metabolisms:
    Medicine:
      effects:
      - !type:ModifyBloodLevel
        amount: 2
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:HealthChange
        damage:
          types:
            # Brute group
            Blunt: -3
            Slash: -3
            Piercing: -3
            # Burn group
            Heat: -3
            Shock: -3
            Cold: -3
            Caustic: -3
            # Airloss group
            Asphyxiation: -3
            Bloodloss: -3
            # Toxin group
            Poison: -3
            Radiation: -3
            # Genetic group
            Cellular: -3
            # Metaphysical group
            Holy: -5
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:ModifyBleedAmount
        amount: -1
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:ChemCleanBloodstream
        cleanseRate: 3
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:GenericStatusEffect
        key: SeeingRainbows
        time: 50.0
        type: Remove
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:TakeStaminaDamage
        amount: -10
        immediate: true
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
    Poison:
      effects:
      - !type:Electrocute
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
          invert: true
        probability: 0.5
      - !type:HealthChange
        damage:
          types:
            Poison: 5
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
            - Heretic
            - Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
          invert: true
  tileReactions:
  - !type:ChangeTileReaction # Rusts tile
