- type: antag
  id: Heretic
  name: roles-antag-heretic-name
  antagonist: true
  setPreference: true
  objective: roles-antag-heretic-description
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 54000 # 15h
  guides: [ Heretics ]

- type: antag
  id: Ghoul
  name: roles-antag-ghoul-name
  antagonist: true
  setPreference: false
  objective: roles-antag-ghoul-description
  guides: [ Heretics ]

# Claw Command - antagSpecifier for the new (post-merge) AntagSelection system.
# The old `definitions:` block on the Heretic/CalmHeretic gamerules was replaced by
# upstream's `antags: AntagCountSelector[]` (PR refactor). prefRoles + mindRoles live
# here now; the previous ClawCommand `chaosScore` and Chaplain `jobBlacklist` extensions
# on AntagSelectionDefinition were runtime-inert and dropped during the migration.
- type: antagSpecifier
  parent: RestrictedAntag
  id: Heretic
  prefRoles:
  - Heretic
  # Goob (and Claw) blacklist Chaplain from rolling Heretic. RestrictedAntag's
  # jobBlacklist is merged via [AlwaysPushInheritance], so this appends Chaplain
  # to the upstream Command/Sec/Cyborg/Intern exclusions rather than replacing them.
  jobBlacklist:
  - Chaplain
  mindRoles:
  - MindRoleHeretic
