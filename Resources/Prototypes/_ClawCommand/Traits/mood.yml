# Claw Command - Mood traits.
#
# These use specials rather than the components list, because traits add their components with overwrite
# enabled: two traits that both hand out PermanentMoodlets or MoodModifier would clobber each other.
# AddMoodletsSpecial and AddMoodModifierSpecial merge instead, so mood traits can be combined.
#
# Multipliers resolve most-specific-first and do not stack with each other: a multiplier for one moodlet
# beats one for that moodlet's category, which beats the positive/negative multiplier.

# --- Flat mood ---

- type: trait
  id: Sanguine
  name: trait-sanguine-name
  description: trait-sanguine-desc
  category: Psychological
  cost: 6
  excludes:
    - Saturnine
  specials:
    - !type:AddMoodletsSpecial
      moodlets:
        - TraitSanguine

- type: trait
  id: Saturnine
  name: trait-saturnine-name
  description: trait-saturnine-desc
  category: Psychological
  cost: -6
  excludes:
    - Sanguine
  specials:
    - !type:AddMoodletsSpecial
      moodlets:
        - TraitSaturnine

# --- Sensitivity to good news ---

