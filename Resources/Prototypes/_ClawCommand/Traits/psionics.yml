# Claw Command - psionic traits, ported from the space fork's Einstein-Engines trait system.
#
# Conversion notes:
#   - That system used `points:` where a NEGATIVE number meant the trait costs points. This fork uses `cost:`
#     where a POSITIVE number costs points, so every value here is the upstream number with its sign flipped.
#   - `functions: !type:TraitAddPsionics` became `specials: !type:AddPsionicPowersSpecial`.
#   - Upstream's rich `requirements:` (CharacterLogicOrRequirement etc.) do not exist here. The three patterns
#     it actually used are expressed with the fields added to TraitPrototype for this port:
#       "LatentPsychic OR one of these jobs"  -> requiresAnyTrait + requiresAnyJob
#       "not an IPC, unless Anomalous Positronics" -> forbiddenSpecies + speciesExemptTraits
#       "not one of these jobs" (they get it free) -> forbiddenJobs

# ---------------------------------------------------------------------------------------------------------
# Gateway traits
# ---------------------------------------------------------------------------------------------------------

- type: trait
  id: LatentPsychic
  name: trait-latent-psychic-name
  description: trait-latent-psychic-desc
  category: Psionic
  cost: 4
  # Claw Command - you cannot both reach for the noosphere and be sealed off from it.
  excludes:
    - PsionicInsulation
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  # The Mantis, RD, Chaplain and Librarian are psionic by default, so buying it again would be wasted points.
  forbiddenJobs:
    - ForensicMantis
    - ResearchDirector
    - Chaplain
    - Librarian
    - Borg
  specials:
    - !type:MakeLatentPsychicSpecial

# Claw Command - the opposite gateway: opting out of psionics entirely. This is space's PsionicInsulation
# trait, which the original port missed. Without it the only way to express "I want nothing to do with
# psionics" was to stack the weakness traits, which left you psionic anyway and paid you for the privilege.
#
# Conversion notes:
#   - upstream `points: -6` becomes `cost: 6`; being immune to every psionic power is worth paying for,
#     even though Mindbroken is a real drawback.
#   - `functions: !type:TraitAddComponent` becomes `specials: !type:AddComponentSpecial`, the equivalent here.
#   - upstream also barred MedicalBorg; that job does not exist in this fork, so only Borg is listed.
- type: trait
  id: PsionicInsulation
  name: trait-psionic-insulation-name
  description: trait-psionic-insulation-desc
  category: Psionic
  cost: 6
  excludes:
    - LatentPsychic
  # An IPC is already insulated, so there is nothing here for them to buy - unless they gave that up.
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  # These roles are psionic as part of the job; sealing them off would break the role.
  forbiddenJobs:
    - ForensicMantis
    - ResearchDirector
    - Chaplain
    - Librarian
    - Borg
  specials:
    - !type:AddComponentSpecial
      components:
        - type: PsionicInsulation
        - type: Mindbroken

- type: trait
  id: AnomalousPositronics
  name: trait-anomalous-positronics-name
  description: trait-anomalous-positronics-desc
  category: Psionic
  cost: 4
  # Only an IPC has psionic insulation to remove in the first place.
  restrictedSpecies:
    - SpeciesIPC
  specials:
    - !type:RemovePsionicInsulationSpecial

# ---------------------------------------------------------------------------------------------------------
# Potentia - how readily new powers are rolled over the round
# ---------------------------------------------------------------------------------------------------------

- type: trait
  id: HighPotential
  name: trait-high-potential-name
  description: trait-high-potential-desc
  category: Psionic
  cost: 5
  excludes:
    - LowPotential
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  # Kitsune already have an equivalent.
  requiresAnyTrait:
    - LatentPsychic
  requiresAnyJob:
    - Chaplain
    - Librarian
    - ResearchDirector
    - ForensicMantis
  specials:
    - !type:MakeLatentPsychicSpecial
      potentiaMultiplier: 1.5

- type: trait
  id: LowPotential
  name: trait-low-potential-name
  description: trait-low-potential-desc
  category: Psionic
  cost: -3 # Claw Command - refunded 5 upstream, which more than paid for Latent Psychic on its own.
  excludes:
    - HighPotential
    # Claw Command - only one psionic weakness may be taken. All three together refunded 11 points against
    # Latent Psychic's 4, so a character could bank 7 spare points for unrelated traits and still be a psion
    # who manifests powers all shift. Picking a single weakness keeps the trade-off without the farm.
    - LowAmplification
    - LowDampening
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  requiresAnyTrait:
    - LatentPsychic
  requiresAnyJob:
    - Chaplain
    - Librarian
    - ResearchDirector
    - ForensicMantis
  specials:
    - !type:MakeLatentPsychicSpecial
      potentiaMultiplier: 0.5

# ---------------------------------------------------------------------------------------------------------
# Amplification and Dampening - raw power versus control
# ---------------------------------------------------------------------------------------------------------

- type: trait
  id: HighAmplification
  name: trait-high-amplification-name
  description: trait-high-amplification-desc
  category: Psionic
  cost: 3
  excludes:
    - LowAmplification
    - PowerOverwhelming
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  requiresAnyTrait:
    - LatentPsychic
  requiresAnyJob:
    - Chaplain
    - Librarian
    - ResearchDirector
    - ForensicMantis
  specials:
    - !type:AddPsionicPowersSpecial
      psionicPowers:
        - HighAmplification

- type: trait
  id: LowAmplification
  name: trait-low-amplification-name
  description: trait-low-amplification-desc
  category: Psionic
  cost: -3
  excludes:
    - HighAmplification
    - PowerOverwhelming
    # Claw Command - see LowPotential; only one psionic weakness may be taken.
    - LowPotential
    - LowDampening
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  requiresAnyTrait:
    - LatentPsychic
  requiresAnyJob:
    - Chaplain
    - Librarian
    - ResearchDirector
    - ForensicMantis
  specials:
    - !type:AddPsionicPowersSpecial
      psionicPowers:
        - LowAmplification

