    - LowAmplification
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  requiresAnyTrait:
    - LatentPsychic
  requiresAnyJob:
    - Chaplain
    - Librarian
    - ResearchDirector
    - ForensicMantis
  specials:
    - !type:AddPsionicPowersSpecial
      psionicPowers:
        - PowerOverwhelming

- type: trait
  id: HighDampening
  name: trait-high-dampening-name
  description: trait-high-dampening-desc
  category: Psionic
  cost: 3
  excludes:
    - LowDampening
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  requiresAnyTrait:
    - LatentPsychic
  requiresAnyJob:
    - Chaplain
    - Librarian
    - ResearchDirector
    - ForensicMantis
  specials:
    - !type:AddPsionicPowersSpecial
      psionicPowers:
        - HighDampening

- type: trait
  id: LowDampening
  name: trait-low-dampening-name
  description: trait-low-dampening-desc
  category: Psionic
  cost: -3
  excludes:
    - HighDampening
    # Claw Command - see LowPotential; only one psionic weakness may be taken.
    - LowPotential
    - LowAmplification
  forbiddenSpecies:
    - SpeciesIPC
  speciesExemptTraits:
    - AnomalousPositronics
  requiresAnyTrait:
    - LatentPsychic
  requiresAnyJob:
    - Chaplain
    - Librarian
    - ResearchDirector
    - ForensicMantis
  specials:
