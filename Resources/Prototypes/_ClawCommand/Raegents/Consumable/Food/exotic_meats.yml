# Claw Command — reagents for Goob-Station exotic meats (Gondola, Bingle).
# Ported from Goob-Station/_Goobstation/Reagents/fun.yml with two adjustments:
#   * the !type:Polymorph effect is stripped because fork doesn't ship the
#     Gondola / Bingle mob prototypes;
#   * the !type:ReagentThreshold conditions are stripped because fork doesn't
#     define that EntityCondition. Without the threshold gates the Mute /
#     Pacify statuses just apply whenever Tranquility metabolizes — close
#     enough to the upstream feel.

- type: reagent
  id: Tranquility
  name: reagent-name-tranquility
  group: Toxins
  desc: reagent-desc-tranquility
  physicalDesc: reagent-physical-desc-calming
  flavor: mindful
  color: "#915E48"
  metabolisms:
    Poison:
      metabolismRate: 0.25
      effects:
      - !type:PopupMessage
          type: Local
          messages: [ "reagent-popup-tranquility" ]
          probability: 0.2
      - !type:GenericStatusEffect
        key: Muted
        component: Muted
      - !type:GenericStatusEffect
        key: Pacified
        component: Pacified

- type: reagent
  id: BingleJuice
  name: reagent-name-binglejuice
  group: Toxins
  desc: reagent-desc-binglejuice
  physicalDesc: reagent-physical-desc-calming
  flavor: bitter
  color: "#1a6ac1"
  metabolisms:
    Poison:
      metabolismRate: 0.05
      effects:
      - !type:PopupMessage
          type: Local
          messages: [ "reagent-popup-binglejuice" ]
          probability: 0.2
