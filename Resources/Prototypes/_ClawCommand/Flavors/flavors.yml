# Claw Command - flavour prototypes referenced by ported food, drink and reagents but never
# defined in this fork. Real definitions come from the `space` / Goob-Station trees where
# they exist; the rest are generated in the fork's own flavour format.

- type: flavor
  id: FlavorClawtail
  flavorType: Complex
  # Claw Command - was flavor-complex-flavorclawtail, an auto-generated stub whose text was literally
  # "FlavorClawtail". The written flavour text already existed as flavor-complex-clawtail in
  # flavor-profiles.ftl but nothing pointed at it, so tasting a clawtail printed the prototype id.
  description: flavor-complex-clawtail

