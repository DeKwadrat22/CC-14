# Glacier station — ported from space/ into ClawCommand rotation.
# Map data: Resources/Maps/glacier.yml
# Adapted job list to match our fork's available jobs (mirrors saltern.yml).

- type: gameMap
  id: Glacier
  mapName: 'Glacier'
  mapPath: /Maps/glacier.yml
  # Glacier is a planet map (snow surface with atmosphere), not space — same processor as the other stations.
  planets: [Lavaland]
  minPlayers: 7
  maxPlayers: 60
  stations:
    Glacier:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationEmergencyShuttle # Euphoria
          emergencyShuttlePath: /Maps/_DeltaV/Shuttles/NTES_Delta.yml
        - type: StationNameSetup
          mapNameTemplate: '{0} Glacier Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'NY'
        - type: StationJobs
          availableJobs:
            Anomaly: [ 4, 4 ] # CLAW COMMAND - Shadekin
            #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 3 ]
            Chef: [ 2, 2 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 3 ]
            #engineering
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 3, 4 ]
            SeniorEngineer: [ 1, 1 ] # Claw Command - senior variant
            TechnicalAssistant: [ 2, 2 ]
            #medical
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            SeniorPhysician: [ 1, 1 ] # Claw Command - senior variant
            MedicalIntern: [ 2, 3 ]
            Paramedic: [ 1, 2 ]
            Psychologist: [ 1, 1 ]
            #science
            Scientist: [ 3, 4 ]
            SeniorResearcher: [ 1, 1 ] # Claw Command - senior variant
            ForensicMantis: [ 1, 1 ] # Claw Command - psionics port
            ResearchAssistant: [ 2, 2 ]
            #security
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            SecurityOfficer: [ 3, 4 ]
            SeniorOfficer: [ 1, 1 ] # Claw Command - senior variant
            SecurityCadet: [ 2, 2 ]
            Lawyer: [ 1, 2 ]
            #civilian extras (spawn points present on map)
            Reporter: [ 1, 1 ]
            #supply
            SalvageSpecialist: [ 2, 3 ]
            CargoTechnician: [ 2, 3 ]
            SeniorCourier: [ 1, 1 ] # Claw Command - senior variant
            #civilian
            Passenger: [ -1, -1 ]
            Prisoner: [ 3, 5 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #silicon
            Borg: [ 2, 2 ]
            DogborgSecurity: [ 2, 3 ]
            DogborgMedical: [ 2, 3 ]
            DogborgEngineering: [ 2, 3 ]
            DogborgJanitor: [ 2, 3 ]
            DogborgService: [ 2, 3 ]
            DogborgMining: [ 2, 3 ]
            ClawCommandOfficer: [ 1, 1 ]
            ClawCommandMaid: [ 1, 1 ]
            StationAi: [ 1, 1 ]
