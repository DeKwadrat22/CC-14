          mapNameTemplate: '{0} Pebble Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'CC'
        - type: StationJobs
          availableJobs:
            Anomaly: [ 4, 4 ] # CLAW COMMAND - Shadekin
            #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            ClawCommandOfficer: [ 1, 1 ]
            ClawCommandMaid: [ 1, 1 ]
            #service
            Bartender: [ 1, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Clown: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Janitor: [ 1, 2 ]
            Mime: [ 1, 1 ]
            Lawyer: [ 2, 2 ]
            Librarian: [ 1, 1 ]
            #engineering
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 1, 1 ]
            StationEngineer: [ 2, 3 ]
            TechnicalAssistant: [ 2, 2 ]
            #medical
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 1, 1 ]
            MedicalDoctor: [ 2, 3 ]
            MedicalIntern: [ 2, 2 ]
            Paramedic: [ 1, 1 ]
            #science
            ResearchDirector: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            Scientist: [ 2, 3 ]
            ResearchAssistant: [ 2, 2 ]
            Borg: [ 2, 2 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            SecurityOfficer: [ 2, 2 ]
            SecurityCadet: [ 1, 1 ]
            #supply
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 2, 2 ]
            CargoTechnician: [ 2, 3 ]
            #civilian
            Passenger: [ -1, -1 ]
            #silicon
            StationAi: [ 1, 1 ]
            DogborgSecurity: [ 3, 3 ]
            DogborgMedical: [ 3, 3 ]
            DogborgEngineering: [ 3, 3 ]
            DogborgJanitor: [ 3, 3 ]
            DogborgService: [ 3, 3 ]
            DogborgMining: [ 3, 3 ]
