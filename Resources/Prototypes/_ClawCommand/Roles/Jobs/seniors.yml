# _ClawCommand: Senior job variants, ported from the Floofstation-based `space` fork
# (Resources/Prototypes/Roles/Jobs/{Security,Engineering,Medical,Science}/senior_*.yml).
#
# Adapted to this fork:
#   - Science department, not DeltaV's Epistemics.
#   - Clothing/PDA live in loadout groups (see _ClawCommand/Loadouts/), so startingGear only
#     carries the same accessories the base job's startingGear does.
#   - Dropped content that doesn't exist here: ClothingOuterArmorPlateCarrier and GetUpImplant
#     (DeltaV/Floof), plus the _Shitmed CPRTraining / SurgerySpeedModifier specials.
#   - Access mirrors the base job (including its extendedAccess) plus the extras the space fork
#     grants seniors, so a senior is never more restricted than the job it supervises.
#   - SeniorCourier has no equivalent in the space fork; SeniorCourierPDA and the SeniorCourier
#     job icon already shipped here unused.
#
# Senior variants deliberately have no spawn points of their own - they reuse the base job's
# markers via SpawnPoint.additionalJobs in Entities/Markers/Spawners/jobs.yml.

# Security
- type: job
  id: SeniorOfficer
  name: job-name-senior-officer
  description: job-description-senior-officer
  playTimeTracker: JobSeniorOfficer
  requirements:
  - !type:DepartmentTimeRequirement
    department: Security
    time: 40h
  startingGear: SeniorOfficerGear
  icon: "JobIconSeniorOfficer"
  supervisors: job-supervisors-hos
  access:
  - Security
  - Brig
  - Maintenance
  - Service
  - External
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]

- type: startingGear
  id: SeniorOfficerGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    ears: ClothingHeadsetSecurity
    pocket1: WeaponPistolMk58
  storage:
    back:
    - Flash
    - MagazinePistol

