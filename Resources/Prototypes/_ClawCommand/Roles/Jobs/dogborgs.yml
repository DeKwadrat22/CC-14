# Roundstart dogborg jobs. One per department; players who already meet the
# regular Borg playtime gate can pick any of these in the lobby, late-join
# midround, or be observed taking them off the ghost role menu.
#
# Each job's `jobEntity` is the matching PlayerDogborg* — see
# _ClawCommand/Entities/Mobs/Player/dogborg_player.yml.
#
# Each job uses its own PlayTimeTracker — the engine enforces a 1:1 mapping
# between tracker and job (SharedJobSystem.SetupTrackerLookup adds them to a
# dict keyed by tracker), so reusing `JobBorg` for all dogborgs would crash
# at startup. Trackers are defined in
# _ClawCommand/Roles/dogborg_play_time_trackers.yml.

- type: job
  id: DogborgSecurity
  name: job-name-dogborg-security
  description: job-description-dogborg-security
  playTimeTracker: JobDogborgSecurity
  requirements:
  - !type:DepartmentTimeRequirement # Same as SecurityOfficer
    department: Security
    time: 14400 # 4h
  canBeAntag: false
  icon: JobIconBorg
  supervisors: job-supervisors-rd
  jobEntity: PlayerDogborgSecurity
  applyTraits: false

