# Security cyborg (K9 / dogborg) plating. Layered armour totals: blunt 50%, slash 50%,
# piercing 45%, heat 40% (explosion 35% is handled separately via ExplosionResistance).
# Coefficient = 1 - reduction, so lower = tougher.
- type: damageModifierSet
  id: ModifierSetSecurityBorg
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.55
    Heat: 0.6

- type: damageModifierSet
  id: ModifierSetFelinid
  coefficients:
    Blunt: 0.85
    Slash: 1.15
    Piercing: 1.15
    Poison: 0.8

- type: damageModifierSet
  id: ModifierSetFeroxi
  coefficients:
    Blunt: 0.9
    Cold: 0.9
    Slash: 1.1

- type: damageModifierSet
  id: ModifierSetKitsune
  coefficients:
    Blunt: 1.20
    Slash: 1.10
    Piercing: 1.10
    Heat: 0.85
    Cold: 0.85
    Radiation: 1.50

- type: damageModifierSet
  id: ModifierSetShadowkin
