# seed packet in:
#   _ClawCommand/Entities/Objects/Specific/Hydroponics/seeds_extras.yml
#
# Note: some chemicals referenced below (Cum, Philterex, Libidozenithizine,
# Pomelustine, Quartzite) do not exist in this fork and will silently not be
# added to produce. The reagent dict is unvalidated so the seeds still load.

