# Plant entities for sibling-fork seeds, modernised from `- type: seed` prototypes.
# Each pairs with a seed packet in:
#   _ClawCommand/Entities/Objects/Specific/Hydroponics/seeds_extras.yml
#
# Some chemicals referenced below (Philterex, Libidozenithizine, Pomelustine,
# Quartzite) do not exist in this fork and will silently not be added to produce.

# ===== _NF =====

- type: entity
  parent: BasePlant
  id: SpesosTreePlants
  categories: [HideSpawnMenu]
  name: spesos tree
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/spesostree.rsi
  - type: PlantData
    name: seeds-spesos-name
    packetPrototype: SpesosTreeSeeds
    productPrototypes: [ SpaceCash ]
  - type: Plant
    lifespan: 45
    maturation: 15
    production: 8
    yield: 3
    potency: 10
    growthStages: 2
  - type: PlantHarvest
    harvestRepeat: Repeat

- type: entity
  parent: BasePlant
  id: PearPlants
  categories: [HideSpawnMenu]
