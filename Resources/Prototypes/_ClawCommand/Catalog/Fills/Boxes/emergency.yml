- type: entity
  parent: BoxSurvival
  id: BoxSurvivalWaterVapor
  suffix: Claw Command, Water Vapor
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyTankWaterVaporFilled
        - id: EmergencyMedipen
        - id: firstaidpen
        - id: FoodSnackNutribrick
        - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: emergencytank

