- type: entity
  parent: BoxCardboard
  id: BoxSurvivalWaterVapor
  name: survival box
  description: It's a box with basic internals inside.
  suffix: Claw Command, Standard Water Vapor
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyTankWaterVaporFilled
        - id: EmergencyMedipen
        - id: firstaidpen
        - id: FoodSnackNutribrick
        - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: emergencytank

