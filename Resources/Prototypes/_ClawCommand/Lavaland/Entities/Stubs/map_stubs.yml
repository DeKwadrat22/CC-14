#
# Inert stubs for Goob-only entity prototypes referenced by ported lavaland
# map YAML (mining outpost, ruins). The actual implementations either
# - belong to systems we deliberately did not port (Shitmed surgery,
#   ShaftMiner job), or
# - haven't been wired up yet (Hierophant arena props).
#
# Without these stubs, MapLoaderSystem throws "Missing prototype for map"
# when loading the ruin grid, which propagates up to GameTicker as an
# entity-without-Transform exception and triggers an infinite RestartRound.
#
# Each stub spawns as an unobtrusive placeholder so the map loads; behavior
# is added later when (and if) the corresponding system is ported.

# --- Shitmed surgery tools (we don't port _Shitmed; replace as inert items)
