# Hierophant spawner — fully ported from Goob _Lavaland/Entities/Markers/Spawners/megafauna.yml.
# MobHierophant already exists at _ClawCommand/Lavaland/Entities/Mobs/Bosses/hierophant.yml.
- type: entity
  parent: MarkerBase
  id: SpawnMobHierophant
  name: Hierophant Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - MobHierophant

