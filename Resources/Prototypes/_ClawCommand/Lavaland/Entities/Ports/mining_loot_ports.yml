# --- Plasma ore stack entity (parent + single variant) ---
# Fork's `PlasmaOreUnprocessed` is a stack proto, not an entity. We add the
# entity wrapper here matching Goob's _Lavaland/.../ore.yml.
- type: entity
  parent: PlasmaOre
  id: PlasmaOreUnprocessed
  name: unprocessed plasma ore
  suffix: Full
  components:
  - type: Stack
    stackType: PlasmaOreUnprocessed

- type: entity
  parent: PlasmaOreUnprocessed
  id: PlasmaOre1Unprocessed
  name: unprocessed plasma ore
  suffix: Single
  components:
  - type: Stack
    count: 1
