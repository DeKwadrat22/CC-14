# Claw Command - the rude buster projectile, fired by CrusherUpgradeMainRudeBuster.
#
# This was missed when the crusher upgrades were ported: the texture came across but the projectile
# prototype did not, and the upgrade's BasicEntityAmmoProvider had its `proto:` line dropped with it.
# That field is `required: true`, so the whole CrusherUpgradeMainRudeBuster prototype failed to load and
# was never registered - which made the Lavaland crusher-upgrade loot spawner throw
# "Attempted to spawn an entity with an invalid prototype" at map init and abort round start.
#
# Two of Goob's Trail fields are deliberately not carried over: `scaleLerpAmount` and `shader`. This
# fork's TrailComponent is a no-op stub (HereticDeps/GoobComponentStubs.cs) that does not define them,
# and the serializer would silently drop them while the linter flagged them as errors.
- type: entity
  id: ProjectileRudeBuster
  parent: BaseBullet
  name: rude buster
  description: Strong magical projectile, that focuses all of the user's will into a single powerful blow.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Projectiles/rude_buster.rsi
    layers:
    - state: buster
      shader: unshaded
      color: "#ae00ffdd"
      scale: 1.5,1.5
  - type: Reflective
    reflective: Magic
  - type: Projectile
    damage:
      types:
        Piercing: 40
        Heat: 40
        Structural: 80
    penetrationThreshold: 500 # Good for breaking rocks (and hordes of fauna)
  - type: StaminaDamageOnCollide
    damage: 60
  - type: Trail
    color: "#ae00ffdd"
    scale: 1.1
    frequency: 0.02
    lifetime: 0.8
    lerpTime: 0.005
    alphaLerpAmount: 0.2
    sprite:
      sprite: /Textures/_ClawCommand/Lavaland/Objects/Projectiles/rude_buster.rsi
      state: buster
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.2,0.4,0.2"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Ammo
    muzzleFlash: null
  - type: TileFrictionModifier
    modifier: 0
  - type: HomingProjectile # TODO this doesn't work since it needs a target to be assigned by an action
    homingSpeed: 2160
  - type: PointLight
    radius: 1.5
    energy: 5
    color: "#ae00ff"
  - type: TimedDespawn
    lifetime: 2.0
