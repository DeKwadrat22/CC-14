# Ported from Goob: Resources/Prototypes/_Lavaland/Entities/Objects/Specific/Salvage/jaunter.yml
# Sprite path adjusted to _ClawCommand convention. PreventChasmFalling system already exists in the fork at
# Content.Shared/_ClawCommand/Lavaland/Chasm/PreventChasmFallingComponent.cs — no code work needed.

- type: entity
  parent: BaseItem
  id: LavalandJaunter
  name: jaunter
  description: A complex device running on bluespace technology, that can teleport you out of danger spaces. You should have this on you when walking near a chasm.
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Specific/Salvage/jaunter.rsi
    state: icon
  - type: Item
    size: Small
  - type: PreventChasmFalling

- type: entity
  parent: LavalandJaunter
  id: LavalandJaunterRecharging
  name: experimental jaunter
  components:
  - type: PreventChasmFalling
    deleteOnUse: false
  - type: UseDelay
    delay: 120
