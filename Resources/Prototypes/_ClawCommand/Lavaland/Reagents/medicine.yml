- type: reagent
  id: MinersSalve
  name: reagent-name-minerssalve
  group: Medicine
  desc: reagent-desc-minerssalve
  physicalDesc: reagent-physical-desc-shiny
  flavor: metallic
  color: "#f2c777"
  recognizable: true
  metabolisms:
    Metabolites:
      effects:
      - !type:ModifyBloodLevel
        amount: 1.5
      - !type:HealthChange
        damage:
          types:
            Heat: -0.4375
            Shock: -0.4375
            Cold: -0.4375
            Caustic: -0.4375
            Blunt: -0.5833
            Slash: -0.5833
            Piercing: -0.5833
            Bloodloss: -1.25
      - !type:ModifyBloodLevel
        amount: 1.5
      - !type:HealthChange
        damage:
          types:
            Heat: -1.1875
            Shock: -1.1875
            Cold: -1.1875
            Caustic: -1.1875
            Blunt: -1.5833
            Slash: -1.5833
            Piercing: -1.5833
            Bloodloss: -1.25
      # _ClawCommand: ReagentThreshold condition dropped — fork lacks the EntityCondition base hierarchy.
      # Overdose poison/cold effect omitted; healing remains unconditional.
      - !type:Jitter
      - !type:PopupMessage
        type: Local
        visualType: Small
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.1
      - !type:Emote
        emote: Scream
        probability: 0.05
        #It's balanced I swear!

