# Tile aliases for legacy / fork-specific tile ids referenced by ported maps.
#
# Asterisk references FloorMS13CarpetFancyBlue (a tile from the MS13 fork
# that was never ported). Without an alias, the whole grid fails to load
# with KeyNotFoundException, leaving the station empty. Aliasing to
# FloorArcadeBlue keeps it a blue carpet-style tile with carpet footsteps.

- type: tileAlias
  id: FloorMS13CarpetFancyBlue
  target: FloorArcadeBlue

- type: tileAlias
  id: FloorMS13CarpetFancyGreen
  target: FloorCarpetOffice

- type: tileAlias
  id: FloorMS13CarpetFancyRed
  target: FloorArcadeRed

# Ruin maps reference FloorWoodDark which doesn't exist in this fork.
# Alias to the closest dark wood-ish tile to keep the grid loadable.
- type: tileAlias
  id: FloorWoodDark
  target: FloorWoodTile

# Cosmic Cult floor tiles — the cult tile system isn't ported, but the cult
# ruin map's tilemap references these. Alias to FloorDark so the grid loads.
- type: tileAlias
  id: FloorCosmicGlyph
  target: FloorDark

- type: tileAlias
  id: FloorCosmicHalf
  target: FloorDark

- type: tileAlias
  id: FloorCosmicNotched
  target: FloorDark

- type: tileAlias
  id: FloorCosmicSmooth
  target: FloorDark

- type: tileAlias
  id: FloorCosmicSplit
  target: FloorDark
