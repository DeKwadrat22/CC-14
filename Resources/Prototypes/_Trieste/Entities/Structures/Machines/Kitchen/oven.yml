- type: entity
  id: TP14KitchenOven
  parent: BaseHeaterMachine
  suffix: Trieste
  name: oven
  description: A stovetop oven. It's in pristine conditions.
  components:
  - type: Appearance
  - type: ItemPlacer
    maxEntities: 4 # big grill, many steaks
    whitelist:
      components:
      - Temperature
  - type: EntityHeater
    settingSound:
      path: /Audio/Weapons/click.ogg
      params:
        volume: -6
  - type: Transform
    noRot: false
  - type: Microwave
    capacity: 12 # 12 instead of 10 - three grilled cheese!
    canMicrowaveIdsSafely: true
    explosionChance: 0.0
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: icon }
          Broken: { state: icon }
          Cooking: { state: icon }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: blank }
          Broken: { state: blank }
          Cooking: { state: bottom-running }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: top-low }
          Medium: { visible: true, state: top-medium }
          High: { visible: true, state: top-high }
  - type: Sprite
    sprite: _Trieste/Structures/Machines/Kitchen/oven.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
      map: [ "enum.MicrowaveVisualizerLayers.Base" ]
    - state: blank
      shader: unshaded
      map: [ "enum.MicrowaveVisualizerLayers.BaseUnlit" ]
    - map: [ "enum.EntityHeaterVisuals.Setting" ]
      shader: unshaded
      visible: false
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.Key:
        type: MicrowaveBoundUserInterface
  - type: ContainerContainer
    containers:
      microwave_entity_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - microwave_entity_container
  - type: ApcPowerReceiver
    powerLoad: 300 # Less than a microwave
  - type: Machine
    board: TP14OvenCircuitboard
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        layer:
        - HighImpassable
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
