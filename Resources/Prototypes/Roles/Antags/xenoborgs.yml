- type: antag
  id: MothershipCore
  name: roles-antag-mothership-core-name
  antagonist: true
  setPreference: true
  objective: roles-antag-mothership-core-objective
  requirements:
  # _ClawCommand: any silicon time (Borg, Station AI, or any dogborg variant)
  # counts toward the 5h gate, so the overlapping silicon roles unlock each other.
  - !type:AnyRoleTimeRequirement
    roles:
    - JobBorg
    - JobStationAi
    - JobDogborgSecurity
    - JobDogborgMedical
    - JobDogborgEngineering
    - JobDogborgJanitor
    - JobDogborgService
    - JobDogborgMining
    time: 18000  # 5 hrs
  guides: [ Xenoborgs ]

- type: antagSpecifier
  parent: RestrictedAntag
  id: MothershipCore
  prefRoles: [ MothershipCore ]
  spawnerPrototype: SpawnPointGhostRoleMothershipCore

