- type: job
  id: StationAi
  name: job-name-station-ai
  description: job-description-station-ai
  playTimeTracker: JobStationAi
  requirements:
  # _ClawCommand: any silicon time (regular Borg or any dogborg variant)
  # counts toward the 5h gate. Replaces the upstream single-role gate so
  # players who grind dogborg roles also unlock Station AI.
  - !type:AnyRoleTimeRequirement
    roles:
    - JobBorg
    - JobStationAi
    - JobDogborgSecurity
    - JobDogborgMedical
    - JobDogborgEngineering
    - JobDogborgJanitor
    - JobDogborgService
    - JobDogborgMining
    time: 18000 # 5h
  weight: 10
  icon: JobIconStationAi
  supervisors: job-supervisors-rd
  jobEntity: StationAiBrain
  jobPreviewEntity: PlayerStationAiPreview
  applyTraits: false

- type: job
  id: Borg
  name: job-name-borg
  description: job-description-borg
  playTimeTracker: JobBorg
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 10h
  icon: JobIconBorg
  supervisors: job-supervisors-rd
