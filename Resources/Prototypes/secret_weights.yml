# Claw Command - Secret no longer rolls a gamemode, it rolls a difficulty.
#
# Each tier is a preset that carries its own roundstart antag roll, event pool and
# scheduler pacing. See:
#   _ClawCommand/game_preset.yml            - the three presets
#   _ClawCommand/GameRules/difficulty.yml   - what each tier can roll at roundstart
#   _ClawCommand/GameRules/event_pools.yml  - what each tier can roll mid-round
#   _ClawCommand/GameRules/schedulers.yml   - how fast each tier rolls it
#
# The old per-gamemode weights (Traitor / Nukeops / Zombie / Revolutionary / ...) moved
# into the roundstart antag rolls inside each tier. Those presets still exist for admins
# to force directly with `setgamepreset`.
- type: weightedRandom
  id: Secret
  weights:
    SecretEasy: 0.30
    SecretMedium: 0.45
    SecretHard: 0.25
